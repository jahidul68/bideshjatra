<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>দালাল নাকি? — বিদেশযাত্রা যাচাই</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="বিদেশে কাজে যাওয়ার আগে সরকারি খরচ, এজেন্সির লাইসেন্স ও দালালের কথা যাচাই করুন।">
<meta name="theme-color" content="#0b5d4b">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow mobile column, like a checklist booklet a family can pass around; status shown as passport-style stamps. */
:root{
  --paper:#f2f5f3; --card:#ffffff; --ink:#13211c; --muted:#56665f; --line:#d3ddd8;
  --brand:#0b5d4b; --brand-ink:#ffffff; --brand-soft:#dfeee8;
  --stamp:#c0352c; --stamp-soft:#fbe6e3;
  --amber:#a8650a; --amber-soft:#fbefd9;
  --ok:#1a7845; --ok-soft:#e1f2e7;
  --display:'Baloo Da 2','Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  --body:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1613; --card:#16211c; --ink:#e5eee9; --muted:#9aaca4; --line:#28362f;
  --brand:#52c29c; --brand-ink:#05201a; --brand-soft:#173a30;
  --stamp:#ff7d70; --stamp-soft:#3a1b18;
  --amber:#f0b45c; --amber-soft:#3a2a10;
  --ok:#66d396; --ok-soft:#173526; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1613; --card:#16211c; --ink:#e5eee9; --muted:#9aaca4; --line:#28362f;
  --brand:#52c29c; --brand-ink:#05201a; --brand-soft:#173a30;
  --stamp:#ff7d70; --stamp-soft:#3a1b18;
  --amber:#f0b45c; --amber-soft:#3a2a10;
  --ok:#66d396; --ok-soft:#173526; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;margin:0}
a{color:var(--brand)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--brand);color:var(--brand-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.back{width:42px;height:42px;border-radius:12px;border:0;background:color-mix(in srgb,var(--brand-ink) 14%,transparent);color:var(--brand-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.back[hidden]{display:none}
.back svg{width:22px;height:22px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;flex:1;min-width:0;text-decoration:none;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{display:block;font-family:var(--body);font-weight:600;font-size:12.5px;opacity:.85;overflow:hidden;text-overflow:ellipsis}
.speak{height:42px;padding:0 14px;border-radius:12px;border:0;background:color-mix(in srgb,var(--brand-ink) 14%,transparent);color:var(--brand-ink);display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;font-size:15px;flex:none}
.speak svg{width:20px;height:20px}

main{padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}

.proto{font-size:14px;color:var(--amber);background:var(--amber-soft);border-radius:12px;padding:10px 14px;display:flex;gap:8px;align-items:flex-start}

/* home */
.hero h1{font-size:clamp(28px,7.5vw,36px);font-weight:800}
.hero p{margin:8px 0 0;color:var(--muted)}
.steps3{display:grid;gap:12px}
.big{display:grid;grid-template-columns:56px 1fr 24px;gap:14px;align-items:center;text-align:left;width:100%;
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.big:hover{border-color:var(--brand)}
.big:active{transform:scale(.99)}
.big .num{width:56px;height:56px;border-radius:14px;background:var(--brand-soft);color:var(--brand);font-family:var(--display);font-weight:800;font-size:30px;display:grid;place-items:center}
.big b{font-family:var(--display);font-size:21px;font-weight:700;display:block;line-height:1.25}
.big span{color:var(--muted);font-size:15px;display:block;margin-top:2px}
.big .arr{color:var(--muted)}
.callstrip{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px dashed var(--line);border-radius:var(--r);padding:14px 16px}
.callstrip .n{font-family:var(--display);font-size:28px;font-weight:800;color:var(--brand);letter-spacing:.02em;user-select:all}
.callstrip p{margin:0;font-size:15px;color:var(--muted);min-width:0}

/* countries */
.search{width:100%;font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cbtn{display:flex;align-items:center;gap:10px;padding:14px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);font-weight:600;font-size:17px;min-width:0}
.cbtn:hover{border-color:var(--brand)}
.cbtn .f{line-height:0;flex:none}
.fimg{height:auto;vertical-align:middle;border-radius:3px;box-shadow:0 0 0 1px var(--line)}
.cbtn .fimg{width:36px}
h1 .fimg{width:40px;margin-right:4px}
.meta .fimg{width:20px}
.cbtn .nm{min-width:0;overflow-wrap:anywhere}
.empty{color:var(--muted);text-align:center;padding:20px}

/* sections */
.sec{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;min-width:0}
.sec h2{font-size:21px;font-weight:700}
.label{font-size:14px;color:var(--muted);font-weight:600}
.money{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,44px);line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums}
.money small{font-size:.5em;font-weight:700;color:var(--muted)}
.src{font-size:13.5px;color:var(--muted)}
.src a{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;padding:3px 10px;border-radius:999px;width:max-content;max-width:100%}
.b-official{background:var(--ok-soft);color:var(--ok)}
.b-news{background:var(--amber-soft);color:var(--amber)}
.b-draft{background:var(--amber-soft);color:var(--amber)}

/* money gap bar */
.gap{display:grid;gap:10px;margin-top:4px}
.row{display:grid;gap:4px}
.row .t{display:flex;justify-content:space-between;gap:10px;font-size:15px;flex-wrap:wrap}
.row .t b{font-variant-numeric:tabular-nums}
.track{height:16px;border-radius:8px;background:var(--paper);position:relative;overflow:hidden}
.fill{position:absolute;top:0;bottom:0;border-radius:8px}
.fill.cap{background:var(--brand);left:0}
.fill.rep{background:repeating-linear-gradient(135deg,var(--stamp) 0 6px,color-mix(in srgb,var(--stamp) 70%,transparent) 6px 12px)}
.gapnote{font-size:15px;background:var(--stamp-soft);color:var(--ink);border-radius:12px;padding:10px 12px}
.gapnote b{color:var(--stamp)}

.warn{background:var(--stamp-soft);border:1.5px solid color-mix(in srgb,var(--stamp) 40%,transparent);border-radius:var(--r);padding:16px;display:grid;gap:6px}
.warn b{color:var(--stamp);font-family:var(--display);font-size:19px}

/* checklist */
.check{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.check li{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;padding:10px;border-radius:12px;background:var(--paper)}
.check input{appearance:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);background:var(--card);cursor:pointer;margin:2px 0 0;display:grid;place-items:center}
.check input:checked{background:var(--ok);border-color:var(--ok)}
.check input:checked::after{content:"";width:8px;height:14px;border:solid var(--card);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check label{cursor:pointer;min-width:0}
.check label b{display:block;font-weight:700}
.check label span{display:block;color:var(--muted);font-size:15px}
.check li.done label b{text-decoration:line-through;text-decoration-color:var(--ok)}
.progress{font-size:14px;color:var(--muted);font-weight:600}

.fees{display:grid;gap:8px}
.fee{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;border-bottom:1px dashed var(--line);padding-bottom:8px}
.fee:last-child{border-bottom:0;padding-bottom:0}
.fee b{font-variant-numeric:tabular-nums;font-size:18px}

/* agency */
.rlform{display:flex;gap:8px}
.rlwrap{display:flex;align-items:center;flex:1;min-width:0;border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding-left:14px}
.rlwrap span{font-weight:700;color:var(--muted)}
.rlwrap input{flex:1;min-width:0;width:100%;border:0;background:transparent;font:inherit;font-size:22px;font-weight:600;padding:12px 10px;color:var(--ink);letter-spacing:.05em}
.rlwrap input:focus{outline:none}
.rlwrap:focus-within{border-color:var(--brand)}
.btn{border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:18px;padding:0 20px;cursor:pointer;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:var(--card);color:var(--brand);border:1.5px solid var(--brand)}
.btn.wide{width:100%}
/* offer check (#check) */
.occta{display:grid;grid-template-columns:auto 1fr 24px;gap:14px;align-items:center;text-decoration:none;color:var(--brand-ink);background:var(--brand);border-radius:var(--r);padding:18px}
.occta .ic{font-size:34px;line-height:1}
.occta b{font-family:var(--display);font-size:23px;font-weight:800;display:block;line-height:1.2}
.occta span span{display:block;font-size:15px;opacity:.9;margin-top:2px}
.occta .arr{color:var(--brand-ink)}
.ocq{display:grid;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:20px}
.ocbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.ocbar i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .2s}
.ocstep{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ocicon{font-size:52px;text-align:center;line-height:1.1}
.ocq h2{font-size:23px;font-weight:700;line-height:1.4}
.ocans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ocans .btn{min-height:60px;font-size:21px}
.ocans .dk{grid-column:1/-1;min-height:48px;font-size:17px}
.ocsay{border:0;background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:6px 12px;font-weight:700;font-size:15px;cursor:pointer}
.ocwhy{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.ocwhy li{background:var(--card);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.ocwhy b{display:block}
.result.mid{border-color:var(--amber);background:var(--amber-soft)}
.ocnext{display:grid;gap:10px}
.oclink{border:0;background:none;color:var(--brand);font-weight:700;font-size:16px;cursor:pointer;padding:6px 0;justify-self:start}
.result{display:grid;gap:10px;padding:18px;border-radius:var(--r);border:2px solid var(--line);background:var(--card);position:relative;overflow:hidden}
.result.bad{border-color:var(--stamp);background:var(--stamp-soft)}
.stamp{justify-self:start;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.04em;padding:2px 14px;border:3px double currentColor;border-radius:8px;transform:rotate(-4deg);opacity:.92}
.stamp.red{color:var(--stamp)}
.stamp.amber{color:var(--amber)}
.stamp.green{color:var(--ok)}
.result.good{border-color:var(--ok);background:var(--ok-soft)}
.result.warn2{border-color:var(--amber);background:var(--amber-soft)}
.ol{margin:0;padding-left:1.3em;display:grid;gap:8px}
.statuses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.st{border-radius:12px;padding:10px 12px;font-size:15px}
.st b{display:block;font-size:16px}
.st.g{background:var(--ok-soft)} .st.g b{color:var(--ok)}
.st.r{background:var(--stamp-soft)} .st.r b{color:var(--stamp)}
.note{font-size:15px;color:var(--muted);border-left:3px solid var(--amber);padding-left:12px}

/* flags */
.flag{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.flag summary{list-style:none;cursor:pointer;padding:16px 16px 16px 18px;display:grid;grid-template-columns:1fr 24px;gap:10px;align-items:center}
.flag summary::-webkit-details-marker{display:none}
.flag summary q{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.35;quotes:"“" "”"}
.flag summary svg{width:22px;height:22px;color:var(--muted);transition:transform .2s}
.flag[open] summary svg{transform:rotate(180deg)}
.flag .body{padding:0 18px 16px;display:grid;gap:8px}
.flag .todo{background:var(--brand-soft);border-radius:10px;padding:10px 12px;font-weight:600}
.contact{display:grid;gap:4px;padding:12px 0;border-bottom:1px dashed var(--line)}
.contact:last-child{border-bottom:0}
.contact .ph{font-family:var(--display);font-size:24px;font-weight:800;color:var(--brand);user-select:all}
.contact .pending{font-size:14px;color:var(--amber)}

.share{display:flex;gap:10px;flex-wrap:wrap}
.share .btn{flex:1 1 150px;font-size:16px;white-space:nowrap}

footer{max-width:560px;margin:8px auto 0;font-size:13.5px;color:var(--muted);display:grid;gap:8px}
footer ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
footer a{color:var(--muted);overflow-wrap:anywhere}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}

.news{background:var(--stamp-soft);border:1px solid var(--stamp);border-radius:var(--r);padding:14px 16px;margin:14px 0}
.news h2{font-size:19px;color:var(--stamp);margin-bottom:8px}
.news ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.news li{display:grid;gap:2px}
.news .nd{font-size:14px;color:var(--muted)}
.news a{font-weight:600}
.news .more{display:inline-block;margin-top:10px;font-size:15px}
/* Bangla digits always use the body font; the display font draws ১ badly */
span.d{font-family:'Noto Sans Bengali',var(--body)!important;font-weight:inherit!important;font-size:inherit!important;color:inherit!important;display:inline!important;margin:0!important}

/* text size */
main,footer{zoom:var(--zoom,1)}
.tsize{height:42px;min-width:42px;padding:0 10px;border-radius:12px;border:0;background:color-mix(in srgb,var(--brand-ink) 14%,transparent);color:var(--brand-ink);font-weight:700;font-size:16px;cursor:pointer;flex:none}

/* visa / labour-market access labels */
.acc{display:inline-block;font-size:13px;font-weight:700;padding:1px 9px;border-radius:999px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.cbtn .acc{display:table;margin:3px 0 0}
.acc.open{background:var(--ok);color:var(--card)}
.acc.limited{background:var(--amber);color:var(--card)}
.acc.closed{background:var(--stamp);color:var(--card)}
.acc.unknown{background:var(--line);color:var(--ink)}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.legend .acc{margin:0}
.legend .src{flex-basis:100%}
.accbox{border-radius:var(--r);padding:14px 16px;display:grid;gap:6px;border:1.5px solid var(--line);background:var(--card)}
.accbox .acc{margin:0}
.accbox.open{border-color:var(--ok);background:var(--ok-soft)}
.accbox.limited{border-color:var(--amber);background:var(--amber-soft)}
.accbox.closed{border-color:var(--stamp);background:var(--stamp-soft)}

/* visitor counter + credit */
.visitors{position:fixed;right:10px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:8;font-size:12.5px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px;opacity:.92}
.visitors b{color:var(--brand)}
.credit{text-align:center;font-size:13px}
@media (min-width:860px){.visitors{bottom:12px}}

/* two-column home on wide screens */
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.col-main,.col-news{display:grid;gap:16px;align-content:start;min-width:0}
.topnav{display:none}
@media (min-width:860px){
  body.wide .page,body.wide footer,body.wide .bar-in{max-width:1080px}
  .split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
  .col-news{position:sticky;top:76px}
  nav.tabs{display:none}
  main{padding-bottom:40px!important}
  .topnav{display:flex;gap:4px;margin-left:auto}
  .topnav a{padding:8px 14px;border-radius:10px;text-decoration:none;color:var(--brand-ink);font-weight:600;font-size:16px;opacity:.85}
  .topnav a:hover{background:color-mix(in srgb,var(--brand-ink) 14%,transparent);opacity:1}
  .topnav a[aria-current="page"]{background:color-mix(in srgb,var(--brand-ink) 22%,transparent);opacity:1}
  .brand{flex:none}
  .bar-in{max-width:1080px}
  .page{max-width:760px}
}

/* bottom tabs (phones only) */
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1.5px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:flex;width:100%;max-width:560px}
.tabs a{flex:1;min-width:0;display:grid;justify-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:600}
.tabs a .ic{font-size:22px;line-height:1.1}
.tabs a[aria-current="page"]{color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}

/* updates tracker */
.upd{background:var(--card);border:1.5px solid var(--line);border-left-width:6px;border-radius:var(--r);padding:14px 16px;display:grid;gap:6px}
.upd.urgent{border-left-color:var(--stamp)} .upd.change{border-left-color:var(--amber)} .upd.info{border-left-color:var(--brand)}
.upd h3{font-size:19px}
.shr{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.shr button{font:inherit;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:36px}
.shr button:hover{border-color:var(--brand)}
.shr .fb{color:#1877f2} .shr .wa{color:var(--ok)} .shr .pc{color:var(--brand)}
.pcov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:16px}
.pcov[hidden]{display:none}
.pcbox{background:var(--card);border-radius:var(--r);padding:14px;max-width:420px;width:100%;max-height:92vh;overflow:auto;display:grid;gap:10px}
.pcbox img{width:100%;border-radius:10px;border:1px solid var(--line)}
.pcbox .row{display:flex;gap:8px;flex-wrap:wrap}
.pcbox .row .btn{flex:1 1 140px}
.upd .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.chip{font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px}

<script>
(function(){
const D = window.APP_DATA;
const view = document.getElementById('view');
const backBtn = document.getElementById('back');

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('bn-BD');
const bnNum = n => nf.format(n);
const bnDigits = s => String(s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const taka = n => '৳' + bnNum(n);
const lakh = n => n >= 100000 ? bnNum(+(n/100000).toFixed(2)) + ' লাখ' : bnNum(n);
const src = id => D.SOURCES[id];
const srcLine = id => { const s = src(id); if(!s) return ''; return `<div class="src">সূত্র: <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>${s.date ? ' · ' + esc(bnDigits(s.date)) : ''}</div>`; };
const BADGE = {
  official: ['b-official','সরকারি প্রজ্ঞাপন থেকে'],
  news:     ['b-news','সংবাদে প্রকাশিত · সরকারি কাগজ যাচাই বাকি'],
  draft:    ['b-draft','খসড়া · যাচাই চলছে']
};
const badge = st => { const b = BADGE[st] || BADGE.draft; return `<span class="badge ${b[0]}">${b[1]}</span>`; };
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2200); }
const chev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const down = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const proto = `<div class="proto"><span>⚠</span><span>পরীক্ষামূলক সংস্করণ। কিছু তথ্য এখনো যাচাই করা হচ্ছে, প্রতিটি সংখ্যার পাশে সূত্র দেওয়া আছে। এটি সরকারি অ্যাপ নয়।</span></div>`;

/* ---------- views ---------- */
function home(){
  return `<div class="split"><div class="col-main">
  <section class="hero">
    <h1>বিদেশে কাজে যাচ্ছেন? টাকা দেওয়ার আগে এই ৪টি জিনিস যাচাই করুন।</h1>
    <p>ধার করে লাখ লাখ টাকা দেওয়ার আগে ৫ মিনিট সময় নিন।</p>
  </section>
  <a class="occta" href="#check"><span class="ic" aria-hidden="true">🔎</span><span><b>দালাল নাকি? অফারটা যাচাই করুন</b><span>৬টি সহজ প্রশ্ন, ১ মিনিট। হ্যাঁ বা না চাপুন।</span></span><span class="arr">${chev}</span></a>
  <div class="steps3">
    <a class="big" href="#countries"><span class="num">১</span><span><b>সরকারি খরচ ও নিয়ম</b><span>কোন দেশে যেতে সরকার কত টাকা ঠিক করেছে</span></span><span class="arr">${chev}</span></a>
    <a class="big" href="#agency"><span class="num">২</span><span><b>এজেন্সি যাচাই</b><span>লাইসেন্স আছে, নাকি বাতিল?</span></span><span class="arr">${chev}</span></a>
    <a class="big" href="#flags"><span class="num">৩</span><span><b>দালাল কি এটা বলছে?</b><span>প্রতারণার সাধারণ কথাগুলো চিনে নিন</span></span><span class="arr">${chev}</span></a>
    <a class="big" href="#myths"><span class="num">৪</span><span><b>ভুল ধারণা ও সত্য</b><span>যেমন: বাংলাদেশ থেকে ডিভি লটারি হয় না</span></span><span class="arr">${chev}</span></a>
  </div>
  <div class="callstrip">
    <span class="n">১৬৭৬৮</span>
    <p>ভিসা আসল কিনা যাচাই করুন: আমি প্রবাসী হেল্পলাইন (সৌদি আরব, কাতার, ওমান)</p>
  </div>
  ${proto}
  </div>
  <aside class="col-news" aria-label="সর্বশেষ খবর ও আপডেট">${updStrip()}${newsBlock()}</aside></div>`;
}

/* flags are small PNGs in /flags: Windows has no flag emoji */
const FLAG_CODE = {saudi:'sa',malaysia:'my',qatar:'qa',oman:'om',uae:'ae',kuwait:'kw',singapore:'sg',bahrain:'bh',jordan:'jo',maldives:'mv',lebanon:'lb',brunei:'bn',iraq:'iq',japan:'jp',russia:'ru',korea:'kr',italy:'it',romania:'ro',libya:'ly',serbia:'rs',bosnia:'ba',kosovo:'xk',moldova:'md',belarus:'by',ukraine:'ua',vietnam:'vn',laos:'la',cambodia:'kh'};
const flagImg = c => FLAG_CODE[c.id] ? `<img class="fimg" src="flags/${FLAG_CODE[c.id]}.png" alt="" width="32" loading="lazy">` : '';

/* ---------- sharing: Facebook, WhatsApp, photocard ---------- */
const hashStr = t => { let h = 0; for(const ch of String(t)) h = (h*31 + ch.codePointAt(0)) >>> 0; return h.toString(36).slice(0,6); };
const updKey = u => 'u-' + u.date + '-' + hashStr(u.title);
const newsKey = n => 'n-' + n.date + '-' + hashStr(n.title);
const siteBase = () => D.META.siteUrl || (location.origin + location.pathname);
const shareRow = (kind, key) => `<div class="shr"><button type="button" class="fb" data-share="fb" data-kind="${kind}" data-key="${esc(key)}">Facebook</button><button type="button" class="wa" data-share="wa" data-kind="${kind}" data-key="${esc(key)}">WhatsApp</button><button type="button" class="pc" data-share="card" data-kind="${kind}" data-key="${esc(key)}">ফটোকার্ড</button></div>`;
function shareItem(kind, key){
  if(kind === 'upd'){
    const u = (D.UPDATES||[]).find(x => updKey(x) === key); if(!u) return null;
    const s = src(u.source);
    return { kind, level: u.level, date: u.date, title: u.title, body: u.what, todo: u.todo,
      outlet: s ? s.title.split(' — ').pop() : '', url: siteBase() + '#' + key };
  }
  const n = (D.NEWS||[]).find(x => newsKey(x) === key); if(!n) return null;
  return { kind, level: 'news', date: n.date, title: n.title, body: '', todo: 'বিদেশে কাজে যাওয়ার আগে এজেন্সি ও খরচ যাচাই করুন।',
    outlet: n.outlet, url: n.url, site: siteBase() };
}
function doShare(how, it){
  const site = it.site || siteBase();
  if(how === 'fb'){ window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(it.url), '_blank', 'noopener'); return; }
  if(how === 'wa'){
    const txt = it.kind === 'upd' ? `⚠️ ${it.title}\n\n${it.todo}\n\nবিস্তারিত: ${it.url}` : `📰 ${it.title} (${it.outlet})\n${it.url}\n\nবিদেশে যাওয়ার আগে যাচাই করুন: ${site}`;
    window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank', 'noopener'); return;
  }
  makeCard(it);
}
function wrapLines(ctx, text, maxW, maxLines){
  const words = String(text).split(/\s+/).filter(Boolean), lines = [];
  let line = '';
  for(let i = 0; i < words.length; i++){
    const t = line ? line + ' ' + words[i] : words[i];
    if(ctx.measureText(t).width <= maxW || !line){ line = t; continue; }
    lines.push(line); line = words[i];
    if(lines.length === maxLines){ line = null; break; }
  }
  if(line) lines.push(line);
  if(lines.length > maxLines) lines.length = maxLines;
  const used = lines.join(' ').split(/\s+/).length;
  if(used < words.length){
    let last = lines[lines.length-1];
    while(last && ctx.measureText(last + '…').width > maxW) last = last.split(' ').slice(0,-1).join(' ');
    lines[lines.length-1] = (last || '') + '…';
  }
  return lines;
}
async function makeCard(it){
  toast('ফটোকার্ড তৈরি হচ্ছে…');
  try{ await Promise.all(['800 60px "Baloo Da 2"','700 40px "Hind Siliguri"','500 36px "Hind Siliguri"'].map(f => document.fonts.load(f, 'বাংলা'))); }catch(e){}
  const W = 1080, H = 1350, P = 72, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const C = { brand:'#0b5d4b', soft:'#dfeee8', ink:'#13211c', muted:'#56665f', paper:'#f2f5f3', red:'#c0352c', amber:'#a8650a', line:'#d3ddd8' };
  const DISP = '"Baloo Da 2","Hind Siliguri","Noto Sans Bengali",sans-serif', BODY = '"Hind Siliguri","Noto Sans Bengali",sans-serif';
  x.fillStyle = C.paper; x.fillRect(0,0,W,H);
  // header band
  x.fillStyle = C.brand; x.fillRect(0,0,W,150);
  x.fillStyle = '#fff'; x.font = `800 58px ${DISP}`; x.textBaseline = 'middle'; x.fillText('দালাল নাকি?', P, 80);
  x.font = `500 30px ${BODY}`; x.textAlign = 'right'; x.fillText('বিদেশযাত্রা যাচাই', W-P, 82); x.textAlign = 'left';
  // card
  const cardY = 190; x.fillStyle = '#fff'; x.beginPath(); x.roundRect(P-24, cardY, W-2*(P-24), H-cardY-190, 28); x.fill();
  const lvColor = {urgent:C.red, change:C.amber, info:C.brand, news:C.brand}[it.level] || C.brand;
  x.fillStyle = lvColor; x.fillRect(P-24, cardY, 14, H-cardY-190);
  let y = cardY + 60;
  const chip = {urgent:'জরুরি আপডেট', change:'নিয়ম পরিবর্তন', info:'জেনে রাখুন', news:'খবর'}[it.level] || 'আপডেট';
  x.font = `700 32px ${BODY}`; const cw = x.measureText(chip).width + 44;
  x.fillStyle = lvColor; x.beginPath(); x.roundRect(P+10, y-30, cw, 60, 30); x.fill();
  x.fillStyle = '#fff'; x.fillText(chip, P+32, y+2);
  x.fillStyle = C.muted; x.font = `500 32px ${BODY}`; x.fillText(bnDigits(it.date), P+cw+34, y+2);
  y += 70; x.textBaseline = 'top';
  const tw = W - 2*P - 30;
  x.fillStyle = C.ink; x.font = `800 60px ${DISP}`;
  for(const l of wrapLines(x, it.title, tw, 4)){ x.fillText(l, P+10, y); y += 76; }
  y += 26;
  if(it.body){
    x.fillStyle = C.ink; x.font = `500 34px ${BODY}`;
    const room = Math.max(2, Math.floor((H - 190 - 330 - y) / 50));
    for(const l of wrapLines(x, it.body, tw, Math.min(room, 9))){ x.fillText(l, P+10, y); y += 50; }
    y += 16;
  }
  if(it.todo){
    x.font = `600 33px ${BODY}`;
    const tl = wrapLines(x, it.todo, tw - 50, 5), bh = 70 + tl.length*48;
    x.fillStyle = C.soft; x.beginPath(); x.roundRect(P+10, y, tw, bh, 20); x.fill();
    x.fillStyle = C.brand; x.font = `800 34px ${DISP}`; x.fillText('✅ আপনার করণীয়', P+34, y+20);
    x.fillStyle = C.ink; x.font = `600 33px ${BODY}`; let ty = y + 70;
    for(const l of tl){ x.fillText(l, P+34, ty); ty += 48; }
  }
  // source line inside card bottom
  if(it.outlet){ x.fillStyle = C.muted; x.font = `500 28px ${BODY}`; x.fillText('সূত্র: ' + it.outlet, P+10, H-190-60); }
  // footer
  x.fillStyle = C.brand; x.fillRect(0, H-150, W, 150);
  x.fillStyle = '#fff'; x.textBaseline = 'middle'; x.font = `700 34px ${BODY}`;
  // the web address is printed only once META.siteUrl is set (own domain)
  const addr = (D.META.siteUrl || '').replace(/^https?:\/\//,'').replace(/\/$/,'');
  x.fillText('দালালের কথায় নয়, সরকারি তথ্য যাচাই করে সিদ্ধান্ত নিন', P, addr ? H-100 : H-75);
  if(addr){ x.font = `600 30px ${BODY}`; x.fillText(addr, P, H-50); }
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const file = new File([blob], 'bideshjatra-' + it.date + '.png', {type:'image/png'});
  const url = URL.createObjectURL(blob);
  const ov = document.getElementById('pcov');
  const canFile = navigator.canShare && navigator.canShare({files:[file]});
  ov.innerHTML = `<div class="pcbox" role="dialog" aria-label="ফটোকার্ড"><img src="${url}" alt="${esc(it.title)}">
    <div class="row">${canFile ? '<button class="btn" type="button" id="pcshare">ছবি শেয়ার করুন</button>' : ''}<a class="btn ${canFile ? 'ghost' : ''}" href="${url}" download="${esc(file.name)}">ছবি ডাউনলোড</a></div>
    <div class="src">${canFile ? 'শেয়ার চাপলে Facebook, WhatsApp বা অন্য অ্যাপ বেছে নিন।' : 'ছবিটি ডাউনলোড করে Facebook বা WhatsApp-এ পোস্ট করুন।'}</div>
    <button class="btn ghost" type="button" id="pcclose">বন্ধ করুন</button></div>`;
  ov.hidden = false;
  const close = () => { ov.hidden = true; ov.innerHTML = ''; URL.revokeObjectURL(url); };
  document.getElementById('pcclose').onclick = close;
  ov.onclick = e => { if(e.target === ov) close(); };
  const sb = document.getElementById('pcshare');
  if(sb) sb.onclick = async () => { try{ await navigator.share({files:[file], title: it.title, text: it.title + '\n' + (it.kind === 'upd' ? it.url : siteBase())}); }catch(e){} };
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-share]'); if(!b) return;
  const it = shareItem(b.dataset.kind, b.dataset.key); if(it) doShare(b.dataset.share, it);
});

function updCard(u){
  const lv = {urgent:'জরুরি', change:'পরিবর্তন', info:'জেনে রাখুন'}[u.level] || 'জেনে রাখুন';
  const isNew = Date.now() - Date.parse(u.date) <= 14*86400000;
  const c = u.country && D.COUNTRIES.find(x => x.id === u.country);
  return `<article class="upd ${esc(u.level)}">
    <div class="meta"><span class="chip ${esc(u.level)}">${lv}</span>${isNew ? '<span class="chip new">নতুন</span>' : ''}<span>${esc(bnDigits(u.date))}</span>${c ? `<a href="#c-${esc(c.id)}">${flagImg(c)} ${esc(c.name)}</a>` : ''}</div>
    <h3>${esc(u.title)}</h3><div>${esc(u.what)}</div><div class="todo">${esc(u.todo)}</div>${u.status ? badge(u.status) : ''}${srcLine(u.source)}${(u.extra||[]).map(srcLine).join('')}${shareRow('upd', updKey(u))}</article>`;
}
function updates(){
  const list = (D.UPDATES||[]).slice().sort((a,b) => b.date.localeCompare(a.date));
  return `<h1 style="font-size:28px">গুরুত্বপূর্ণ আপডেট</h1>
    <p style="margin:0;color:var(--muted)">বিদেশ যাওয়ার নিয়ম, খরচ বা সতর্কতায় সাম্প্রতিক পরিবর্তন। নতুন খবর পেলে এখানে যোগ হয়।</p>
    ${list.map(updCard).join('')}
    <div class="src">সর্বশেষ হালনাগাদ: ${esc(bnDigits(D.META.lastUpdated))}</div>`;
}
function updStrip(){
  const list = (D.UPDATES||[]).slice().sort((a,b) => b.date.localeCompare(a.date)).slice(0,2);
  if(!list.length) return '';
  return `<section class="updstrip"><h2>🔔 সর্বশেষ গুরুত্বপূর্ণ আপডেট</h2>${list.map(updCard).join('')}<a class="btn ghost wide" href="#updates">সব আপডেট দেখুন</a></section>`;
}

function newsBlock(){
  const day = 86400000, now = Date.now();
  const items = (D.NEWS || []).filter(n => { const t = Date.parse(n.date); return t && now - t <= 30*day && t - now < day; })
    .sort((a,b) => b.date.localeCompare(a.date));
  return `<section class="news"><h2>গত ৩০ দিনের প্রতারণা ও দালালের খবর</h2>` +
    (items.length

function country(id){
  const c = D.COUNTRIES.find(x => x.id === id);
  if(!c) return `<p class="empty">দেশটি পাওয়া যায়নি। <a href="#countries">সব দেশ দেখুন</a></p>`;
  const done = store.get('steps-'+c.id) || [];
  let h = `<h1 style="font-size:30px"><span aria-hidden="true">${flagImg(c)}</span> ${esc(c.name)}</h1>`;

  if(c.access){
    const a = c.access;
    h += `<div class="accbox ${esc(a.state)}"><div><span class="acc ${esc(a.state)}">${ACCESS[a.state][0]}</span> <b>${ACCESS[a.state][1]}</b></div><div>${esc(a.note)}</div>${a.source ? srcLine(a.source) : ''}<div class="src">সরকারি ঘোষণা নয়, সংবাদ থেকে নেওয়া। যাওয়ার আগে <a href="#agency">এজেন্সি যাচাই</a> করুন ও BMET-এ নিশ্চিত হোন।</div></div>`;
  }
  if(c.warning){
    h += `<div class="warn"><b>সতর্কতা</b><div>${esc(c.warning.text)}</div>${srcLine(c.warning.source)}</div>`;
  }
  const ups = (D.UPDATES||[]).filter(u => u.country === c.id || (u.countries||[]).includes(c.id)).sort((x,y) => y.date.localeCompare(x.date));
  if(ups.length) h += `<section class="sec"><h2>এই দেশ নিয়ে গুরুত্বপূর্ণ আপডেট</h2>${ups.map(updCard).join('')}</section>`;

  // cost
  h += `<section class="sec"><h2>সরকার নির্ধারিত সর্বোচ্চ খরচ</h2>`;
  if(c.cap){
    h += `<div class="money">${taka(c.cap.amount)} <small>টাকা</small></div>
      <div class="label">${esc(c.cap.year)} সালের হার অনুযায়ী</div>
      ${badge(c.cap.status)}`;
    if(c.reported){
      const max = c.reported.max;
      const pc = n => Math.max(2, Math.min(100, n / max * 100));
      h += `<div class="gap" role="img" aria-label="সরকারি খরচ ${lakh(c.cap.amount)} টাকা, মানুষ দিচ্ছেন ${lakh(c.reported.min)} থেকে ${lakh(c.reported.max)} টাকা">
        <div class="row"><div class="t"><span>সরকারি সর্বোচ্চ</span><b>${lakh(c.cap.amount)} টাকা</b></div>
          <div class="track"><div class="fill cap" style="width:${pc(c.cap.amount)}%"></div></div></div>
        <div class="row"><div class="t"><span>মানুষ আসলে দিচ্ছেন</span><b>${lakh(c.reported.min)}–${lakh(c.reported.max)} টাকা</b></div>
          <div class="track"><div class="fill rep" style="left:${pc(c.reported.min)}%;width:${pc(max)-pc(c.reported.min)}%"></div></div></div>
      </div>
      <div class="gapnote">সরকারি খরচের চেয়ে <b>${bnNum(Math.round(c.reported.min / c.cap.amount * 10)/10)} থেকে ${bnNum(Math.round(c.reported.max / c.cap.amount * 10)/10)} গুণ</b> বেশি টাকা দিচ্ছেন অনেকে। এর বেশিরভাগই নিয়মবিরুদ্ধ।</div>
      <div class="src">${esc(c.reported.note || '')}</div>
      ${c.reported.source !== c.cap.source ? srcLine(c.reported.source) : ''}`;
    }
    h += srcLine(c.cap.source);
    h += `<div class="note">এর বেশি টাকা চাইলে লিখিত রসিদ চান এবং <a href="#flags">কোথায় অভিযোগ করবেন</a> দেখুন।</div>`;
  } else {
    h += `<div class="label">এই দেশের জন্য সরকার নির্ধারিত খরচের তথ্য সংগ্রহ চলছে।</div>`;
  }
  h += `</section>`;

  // detailed breakdown + recommended routes
  h += `<section class="sec"><h2>খরচের বিস্তারিত ও যাওয়ার সরকারি পথ</h2>`;
  const d = c.detail;
  if(d){
    const ul = a => `<ul class="ol" style="margin:6px 0">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    if(d.latest) h += `<div class="warn"><b>সর্বশেষ অবস্থা</b><div>${esc(d.latest.text)}</div>${srcLine(d.latest.source)}</div>`;
    if(d.covered) h += `<h3 style="font-size:17px;margin-top:10px">সরকার নির্ধারিত খরচে যা ধরা আছে</h3>${ul(d.covered)}<div class="src">${esc(d.coveredNote||'')}</div>`;
    if(d.employer) h += `<h3 style="font-size:17px;margin-top:10px">নিয়োগকর্তার দেওয়ার কথা</h3>${ul(d.employer)}<div class="src">${esc(d.employerNote||'')}</div>`;
    else if(d.employerNote) h += `<div class="src">${esc(d.employerNote)}</div>`;
    if(d.routes) h += `<h3 style="font-size:17px;margin-top:10px">যাওয়ার সরকার অনুমোদিত পথ</h3>${ul(d.routes)}`;
    h += `${badge(d.status)}${srcLine(d.source)}<div class="note">কোন খরচে কত টাকা, সরকার এখনো আলাদা করে প্রকাশ করেনি বা আমরা পাইনি। মোট সংখ্যার বেশি চাইলে রসিদ চান।</div>`;
  } else {
    h += `<div class="label">এই দেশের খরচের বিস্তারিত তথ্য সংগ্রহ চলছে।</div>
      <ul class="ol" style="margin:8px 0"><li>শুধু BMET-এর লাইসেন্সপ্রাপ্ত রিক্রুটিং এজেন্সির মাধ্যমে যান। <a href="#agency">এজেন্সি যাচাই করুন</a></li><li>সরকারি প্রতিষ্ঠান BOESL-এর মাধ্যমেও যাওয়া যায়।</li></ul>
      <div class="src">খসড়া তথ্য, যাচাই চলছে।</div>`;
  }
  h += `</section>`;

  // visa check
  if(c.visaCheck){
    h += `<div class="callstrip"><span class="n">১৬৭৬৮</span><p>এই দেশের ভিসা আসল কিনা ফোন করে যাচাই করুন (আমি প্রবাসী, সামান্য ফি)।</p></div>`;
  }

  // fees
  if(D.FEES.length){
    h += `<section class="sec"><h2>সবাইকে যে সরকারি ফি দিতে হয়</h2><div class="fees">` +
      D.FEES.map(f => `<div class="fee"><span>${esc(f.name)}<br><span class="src">${esc(f.from||'')}</span></span><b>${taka(f.amount)}</b></div>`).join('') +
      `</div>${D.FEES.map(f=>srcLine(f.source)).join('')}</section>`;
  }

  // steps
  h += `<section class="sec"><h2>বৈধভাবে যাওয়ার ধাপ</h2>
    <div class="progress" id="prog"></div>
    <ul class="check">` +
    D.STEPS.map((s,i) => `<li class="${done.includes(i)?'done':''}"><input type="checkbox" id="st-${c.id}-${i}" data-i="${i}" ${done.includes(i)?'checked':''}><label for="st-${c.id}-${i}"><b>${esc(s.title)}</b><span>${esc(s.detail)}</span></label></li>`).join('') +
    `</ul>${D.STEPS.some(s=>s.status!=='official') ? `<div class="src">কিছু ধাপ এখনো খসড়া, যাচাই চলছে।</div>` : ''}</section>`;

  h += shareBlock(`${c.name}-এ যেতে সরকার নির্ধারিত খরচ ও নিয়ম দেখুন`);
  return h;
}

function checkRL(raw){
  const box = document.getElementById('rlresult');
  const digits = String(raw).replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/\D/g,'').replace(/^0+/,'');
  if(!digits){ box.innerHTML = `<div class="result"><b>শুধু সংখ্যাটি লিখুন</b><div class="src">যেমন: RL-1428 হলে লিখুন 1428</div></div>`; return; }
  const L = window.AGENCY_LIST;
  const off = L && L.rows.find(r => r[0] === digits);
  if(off){
    const [rl, name, st, exp] = off;
    const lapsed = st === 'active' && exp && exp < new Date().toISOString().slice(0,10);
    const info = {
      active:    ['good','green','সক্রিয়','মেয়াদ শেষ না হওয়া পর্যন্ত লাইসেন্স বৈধ। তবে লিখিত চুক্তি ও রসিদ ছাড়া টাকা দেবেন না।'],
      expired:   ['bad','red','মেয়াদ শেষ','লাইসেন্সের মেয়াদ শেষ। টাকা দেবেন না।'],
      cancelled: ['bad','red','বাতিল','লাইসেন্স বাতিল। টাকা দেবেন না।'],
      suspended: ['bad','red','স্থগিত','লাইসেন্স স্থগিত। টাকা দেবেন না।']
    }[lapsed ? 'expired' : st] || ['warn2','amber',st,'অবস্থা নিশ্চিত নয়, সরকারি তালিকায় দেখুন।'];
    const flagged = D.AGENCIES_FLAGGED.find(a => a.rl === digits);
    box.innerHTML = `<div class="result ${info[0]}">
      <span class="stamp ${info[1]}">${info[2]}</span>
      <div><b>RL-${esc(bnDigits(rl))} · ${esc(name)}</b></div>
      <div>${info[3]}</div>
      ${exp ? `<div>মেয়াদ: ${esc(bnDigits(exp))}</div>` : ''}
      ${flagged ? `<div>${esc(flagged.date)}: ${esc(flagged.reason)}।</div>${srcLine(flagged.source)}` : ''}
      <div class="src">সরকারি (BMET) তালিকার কপি, ${esc(bnDigits(L.date))} তারিখে নেওয়া। সর্বশেষ অবস্থা <a href="https://oep.gov.bd/agencies" target="_blank" rel="noopener">সরকারি সাইটে</a> মিলিয়ে নিন।</div>
    </div>`;
    box.scrollIntoView({behavior:'smooth',block:'nearest'});
    return;
  }
  const hit = D.AGENCIES_FLAGGED.find(a => a.rl === digits);
  if(hit){
    const word = hit.status === 'suspended' ? 'স্থগিত' : 'বাতিল';
    box.innerHTML = `<div class="result bad">
      <span class="stamp red">লাইসেন্স ${word}</span>
      <div><b>RL-${esc(bnDigits(hit.rl))} · ${esc(hit.name)}</b></div>
      <div>${esc(hit.date)} লাইসেন্স ${word} করা হয়েছে। কারণ: ${esc(hit.reason)}।</div>
      <div style="font-weight:700;color:var(--stamp)">এই এজেন্সিকে টাকা দেবেন না। আগে দিয়ে থাকলে রসিদ ও কাগজ রেখে অভিযোগ করুন।</div>
      ${srcLine(hit.source)}
      <a class="btn" href="#flags">কোথায় অভিযোগ করবেন</a>
    </div>`;
  } else {
    box.innerHTML = `<div class="result">
      <span class="stamp amber">নিজে যাচাই করুন</span>
      <div><b>RL-${esc(bnDigits(digits))}</b> সরকারি তালিকার আমাদের কপিতে পাওয়া যায়নি।</div>
      <div>নম্বরটি ঠিক আছে কিনা দেখুন। তালিকায় না থাকলে ওই এজেন্সির সঙ্গে লেনদেন করবেন না। নিচের সরকারি তালিকায় অবশ্যই দেখে নিন।</div>
    </div>`;
  }
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

  function ask(i){
    const q = Q[i];
    box.innerHTML = `<div class="ocq">
      <div class="ocbar" aria-hidden="true"><i style="width:${Math.round(i/Q.length*100)}%"></i></div>

      <div class="ocans">
        <button class="btn" type="button" data-a="yes">হ্যাঁ</button>
        <button class="btn" type="button" data-a="no">না</button>
        <button class="btn ghost dk" type="button" data-a="dk">জানি না</button>
      </div>
      ${i ? '<button class="oclink" type="button" id="ocback">← আগের প্রশ্ন</button>' : ''}
    </div>`;
    fixDigits(box);
    box.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => { stopSpeak(); ans[i] = b.dataset.a; i + 1 < Q.length ? ask(i+1) : result(); }));
    const sb = document.getElementById('ocsay'); if(sb) sb.addEventListener('click', () => say(q.q + '। হ্যাঁ, না, নাকি জানি না?'));
    const bk = document.getElementById('ocback'); if(bk) bk.addEventListener('click', () => { stopSpeak(); ask(i-1); });
    if(i) document.getElementById('ocq').focus({preventScroll:true});
  }
  function result(){
    const yes = Q.map((q,i) => ({q, a:ans[i]})).filter(x => x.a === 'yes');
    const dk = ans.filter(a => a === 'dk').length;
    const lvl = yes.some(x => x.q.level === 'high') ? 'red' : (yes.length || dk) ? 'amber' : 'green';
    const R = {
      red:   ['bad','red','খুব ঝুঁকিপূর্ণ','এটা ফাঁদ হতে পারে। টাকা দেবেন না, কাগজে সই করবেন না।'],
      amber: ['mid','amber','আরও যাচাই করুন','কিছু বিষয় নিশ্চিত নয়। নিচের বিষয়গুলো যাচাই না করে টাকা দেবেন না।'],
      green: ['good','green','বড় বিপদের লক্ষণ পাওয়া যায়নি','তবুও নিচের ধাপগুলো যাচাই করে তারপর এগোন। এই পরীক্ষা নিশ্চয়তা দেয় না।']
    }[lvl];
    const reasons = yes.map(x => `<li><b>${esc(x.q.q)}</b>${esc(x.q.why)}${srcLine(x.q.source)}</li>`).join('');
    box.innerHTML = `<div class="result ${R[0]}" id="ocres" tabindex="-1">
      <span class="stamp ${R[1]}">${R[2]}</span>
      <div style="font-size:19px;font-weight:700">${R[3]}</div>
      ${reasons ? `<div>যে কারণে:</div><ul class="ocwhy">${reasons}</ul>` : ''}
      ${dk ? `<div>${bnNum(dk)}টি প্রশ্নের উত্তর আপনি জানেন না। দালাল বা এজেন্সির কাছে লিখিতভাবে জেনে নিন।</div>` : ''}
    </div>
    <section class="sec"><h2>এখন কী করবেন</h2>
      <div class="ocnext">
        <a class="btn wide" href="#agency">এজেন্সির লাইসেন্স যাচাই করুন</a>
        <a class="btn ghost wide" href="#countries">দেশের সরকারি খরচ দেখুন</a>
        <a class="btn ghost wide" href="#help">কোথায় সাহায্য ও অভিযোগ</a>
      </div>
      <div class="note">সৌদি আরব, কাতার বা ওমানের ভিসা আসল কিনা জানতে ১৬৭৬৮ নম্বরে কল করুন (আমি প্রবাসী হেল্পলাইন)।</div>
      <button class="oclink" type="button" id="ocagain">↻ আবার শুরু করুন</button>
    </section>
    ${shareBlock('দালাল নাকি? বিদেশের চাকরির প্রস্তাব ১ মিনিটে যাচাই করুন')}`;
    fixDigits(box);
    wireShare();
    document.getElementById('ocagain').addEventListener('click', () => { ans.length = 0; ask(0); window.scrollTo(0,0); });
    document.getElementById('ocres').focus({preventScroll:true});
    window.scrollTo(0,0);
    if(bnVoice) say(R[2] + '। ' + R[3]);
  }
  ask(0);
}

/* wrap Bangla digit runs in .d so they use the body font */
function fixDigits(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while(w.nextNode()){ const n = w.currentNode; if(/[০-৯]/.test(n.nodeValue) && !n.parentElement.closest('script,style,.d,input,textarea')) nodes.push(n); }
  nodes.forEach(n => {
    const frag = document.createDocumentFragment();
    n.nodeValue.split(/([০-৯][০-৯,.]*)/).forEach((part,i) => {
      if(i % 2){ const s = document.createElement('span'); s.className = 'd'; s.textContent = part; frag.appendChild(s); }
      else if(part) frag.appendChild(document.createTextNode(part));
    });
    n.replaceWith(frag);
  });
}
/* digits in results rendered later (RL check, country search) get the same fix */
new MutationObserver(() => fixDigits(document.body)).observe(document.body, {childList:true, subtree:true});
/* visitors today: one count per browser per Bangladesh day, via the free Abacus counter (no personal data sent) */
(async function(){
  try{
    const day = new Date(Date.now() + 6*3600e3).toISOString().slice(0,10);
    const seen = store.get('visited') === day;
    const r = await fetch(`https://abacus.jasoncameron.dev/${seen ? 'get' : 'hit'}/bideshjatra-jahid/d-${day}`);
    if(!r.ok) return;
    const v = (await r.json()).value;
    if(typeof v !== 'number') return;
    if(!seen) store.set('visited', day);
    document.getElementById('vcount').textContent = bnNum(v);
    document.getElementById('visitors').hidden = false;
  }catch(e){}
})();

/* ---------- router ---------- */
function pageUrl(){ return siteBase() + location.hash; }
function route(){
  stopSpeak();
  const h = (location.hash || '#home').slice(1);
  let html, isHome = false;
  if(h === 'countries') html = countries();
  else if(h.startsWith('c-')) html = country(h.slice(2));
  else if(h === 'agency') html = agency();
  else if(h === 'flags' || h === 'help') html = flags();
  else if(h === 'check') html = offerCheck();
  else if(h === 'myths') html = myths();
  else if(h === 'updates') html = updates();
  else if(h.startsWith('u-')){ const u = (D.UPDATES||[]).find(x => updKey(x) === h);
    html = u ? `<h1 style="font-size:28px">গুরুত্বপূর্ণ আপডেট</h1>${updCard(u)}<a class="btn ghost wide" href="#updates">সব আপডেট দেখুন</a>` : updates(); }
  else { html = home(); isHome = true; }
  view.innerHTML = html;
  fixDigits(document.body);
  document.body.classList.toggle('wide', isHome);
  const tab = h.startsWith('u-') ? 'updates' : h.startsWith('c-') ? 'countries' : (h === 'myths' || h === 'help' ? 'flags' : (isHome ? 'home' : h));
  document.querySelectorAll('[data-tab]').forEach(a => {
    if(a.dataset.tab === tab) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
  backBtn.hidden = isHome;
  window.scrollTo(0,0);
  wire(h);
  if(h === 'help'){ const e = document.getElementById('help'); if(e) e.scrollIntoView(); }
}
function wire(h){
  const q = document.getElementById('q');
  if(q) q.addEventListener('input', () => {
    const v = q.value.trim().toLowerCase();
    document.getElementById('cgrid').innerHTML = countryButtons(D.COUNTRIES.filter(c => c.name.includes(v) || c.id.includes(v)));
  });
  const f = document.getElementById('rlform');
  if(f) f.addEventListener('submit', e => { e.preventDefault(); checkRL(document.getElementById('rl').value); });
  if(h.startsWith('c-')){
    const id = h.slice(2);
    const update = () => {
      const boxes = [...view.querySelectorAll('.check input')];
      const n = boxes.filter(b=>b.checked).length;
      const p = document.getElementById('prog');
      if(p) p.textContent = `${bnNum(boxes.length)}টি ধাপের মধ্যে ${bnNum(n)}টি সম্পন্ন`;
    };
    view.querySelectorAll('.check input').forEach(b => b.addEventListener('change', () => {
      b.closest('li').classList.toggle('done', b.checked);
      store.set('steps-'+id, [...view.querySelectorAll('.check input')].filter(x=>x.checked).map(x=>+x.dataset.i));
      update();
    }));
    update();
  }
  if(h === 'check') ocRun();
  wireShare();
}
function wireShare(){
  const wa = document.getElementById('wa');
  if(wa) wa.href = 'https://wa.me/?text=' + encodeURIComponent(wa.dataset.text + ': ' + pageUrl());
  const cp = document.getElementById('copylink');
  if(cp) cp.addEventListener('click', async () => {
    const url = pageUrl();
    try { await navigator.clipboard.writeText(url); toast('লিংক কপি হয়েছে'); }
    catch(e){
      const ta = document.createElement('textarea'); ta.value = url; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
      let ok=false; try{ ok=document.execCommand('copy') }catch(_){} ta.remove();
      toast(ok ? 'লিংক কপি হয়েছে' : url);
    }
  });
}
backBtn.addEventListener('click', () => {
  const h = (location.hash||'').slice(1);
  location.hash = h.startsWith('c-') ? 'countries' : 'home';
});
addEventListener('hashchange', route);

/* ---------- read aloud (only if the phone has a Bangla voice) ---------- */
const speakBtn = document.getElementById('speak'), speakLabel = document.getElementById('speakLabel');
let bnVoice = null, speaking = false;
function findVoice(){
  if(!('speechSynthesis' in window)) return;
  bnVoice = speechSynthesis.getVoices().find(v => /^bn/i.test(v.lang)) || null;
  speakBtn.hidden = !bnVoice;
}
function speakText(t){
  if(!bnVoice) return; speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.voice = bnVoice; u.lang = bnVoice.lang; u.rate = .95;
  u.onend = stopSpeak; speechSynthesis.speak(u); speaking = true; speakLabel.textContent = 'থামান';
}
function stopSpeak(){ if('speechSynthesis' in window) speechSynthesis.cancel(); speaking=false; speakLabel.textContent='শুনুন'; }
if('speechSynthesis' in window){
  findVoice(); speechSynthesis.addEventListener?.('voiceschanged', findVoice);
  speakBtn.addEventListener('click', () => {
    if(speaking){ stopSpeak(); return; }
    const clone = view.cloneNode(true);
    clone.querySelectorAll('.src,.share,.badge,input,form,.statuses,a.btn').forEach(n=>n.remove());
    clone.querySelectorAll('details').forEach(d=>d.setAttribute('open',''));
    const u = new SpeechSynthesisUtterance(clone.innerText.replace(/\s+/g,' '));
    u.voice = bnVoice; u.lang = bnVoice.lang; u.rate = .95;
    u.onend = stopSpeak;
    speechSynthesis.speak(u); speaking = true; speakLabel.textContent = 'থামান';
  });
}

document.getElementById('foot').innerHTML = foot();
route();
})();
