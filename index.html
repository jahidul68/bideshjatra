function ocRun(){
  const Q = D.OFFER_CHECK || [], out = document.getElementById('ocres');
  if(!out || !Q.length) return;
  wireShare();
  const boxes = [...document.querySelectorAll('.ocmine input')];
  function show(){
    const hit = boxes.filter(b => b.checked).map(b => Q[+b.dataset.i]);
    boxes.forEach(b => document.getElementById('ocf' + b.dataset.i).classList.toggle('hit', b.checked));
    if(!hit.length){
      out.innerHTML = `<div class="result good"><span class="stamp green">${T('কোনো লক্ষণ টিক দেননি','No signs ticked')}</span>
        <div>${T('উপরের কোনোটি আপনার প্রস্তাবে না থাকলেও নিশ্চিত হবেন না। নিচের ধাপে এজেন্সির লাইসেন্স ও সরকারি খরচ যাচাই করে তারপর টাকা দিন।',"Even if none of these are in your offer, don't assume it's safe. Check the agency's licence and the official cost below, then pay.")}</div></div>`;
    } else {
      const red = hit.some(q => q.level === 'high');
      out.innerHTML = red
        ? `<div class="result bad"><span class="stamp red">${T('খুব ঝুঁকিপূর্ণ','Very risky')}</span>
            <div style="font-size:19px;font-weight:700">${T(`আপনার প্রস্তাবে ${bnNum(hit.length)}টি লক্ষণ আছে। এটা ফাঁদ হতে পারে। টাকা দেবেন না, কাগজে সই করবেন না।`, `Your offer has ${hit.length} warning sign${hit.length > 1 ? 's' : ''}. It may be a trap. Don't pay, and don't sign anything.`)}</div></div>`
        : `<div class="result mid"><span class="stamp amber">${T('আরও যাচাই করুন','Check further')}</span>
            <div style="font-size:19px;font-weight:700">${T(`আপনার প্রস্তাবে ${bnNum(hit.length)}টি লক্ষণ আছে। যাচাই না করে টাকা দেবেন না।`, `Your offer has ${hit.length} warning sign${hit.length > 1 ? 's' : ''}. Don't pay until you have checked.`)}</div></div>`;
    }
    fixDigits(out);
  }
  boxes.forEach(b => b.addEventListener('change', show));
  const sb = document.getElementById('ocsay');
  if(sb) sb.addEventListener('click', () => speakText(Q.map((q,i) => `${bnNum(i+1)}। ${q.fact || q.q}`).join('। ')));
  show();
}

function myths(){

async function sbGet(path){

function demoData(){
  let a = 7; const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pick = w => { const tot = Object.values(w).reduce((x,y) => x+y, 0); let r = rnd()*tot; for(const [k,v] of Object.entries(w)){ if((r -= v) < 0) return k; } };
  const cw = {saudi:40,malaysia:14,qatar:8,uae:6,singapore:6,kuwait:4,oman:4,italy:5,japan:3,korea:3,romania:3,uk:2,maldives:2,jordan:1,portugal:1,croatia:1,canada:1,australia:1};
  const dw = Object.fromEntries(Object.keys(DIST).map(k => [k, 1]));
  Object.assign(dw, {cumilla:20,brahmanbaria:12,dhaka:9,tangail:8,kishoreganj:7,chandpur:7,chattogram:7,noakhali:7,narsingdi:6,mymensingh:5,sylhet:5});
  const rows = [], amts = {};
  for(let i = 0; i < 420; i++){
    const country = pick(cw), district = pick(dw), stage = pick({want:6, process:2, went:3});
    rows.push({district, country, stage, n: 1});
    if(rnd() < .4){ const cap = (cById(country).cap||{}).amount || 250000; (amts[country] = amts[country] || []).push(Math.round(cap * (1.5 + rnd()*4) / 5000) * 5000); }
  }
  const costs = Object.entries(amts).filter(([,v]) => v.length >= 3).map(([country, v]) => { v.sort((x,y) => x-y); return { country, n: v.length, median: v[v.length >> 1], low: v[0], high: v[v.length-1] }; });
  return { flows: rows, costs };
}

/* "৪.৫ লাখ", "450000", "৪৫০,০০০" → taka; numbers under 100 are read as lakh */
function parseAmt(v){
  v = String(v || '').replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/[,\s]/g, '');
  const lk = /লাখ|lakh|lac/i.test(v); const n = parseFloat(v.replace(/[^\d.]/g, ''));

  return Math.round(lk || n < 100 ? n * 100000 : n);
}

function arcPath(o, p){
  const dx = p[0]-o[0], dy = p[1]-o[1], len = Math.hypot(dx, dy) || 1;
  let nx = -dy/len, ny = dx/len; if(ny > 0){ nx = -nx; ny = -ny; }
  const k = len * .22, cx = (o[0]+p[0])/2 + nx*k, cy = (o[1]+p[1])/2 + ny*k;
  return { d: `M${o[0]},${o[1]}Q${cx.toFixed(1)},${cy.toFixed(1)} ${p[0]},${p[1]}`, len: Math.ceil(len * 1.15) };
}
function zoomBox(){
  const G = window.MAP_GEO;
  if(mState.zoom === 'world') return G.viewBox;
  const ids = ['saudi','qatar','uae','oman','kuwait','bahrain','jordan','lebanon','iraq','maldives','malaysia','singapore','brunei','thailand','vietnam','hongkong'];
  const xs = ids.map(i => G.pts[i][0]).concat(G.origin[0]), ys = ids.map(i => G.pts[i][1]).concat(G.origin[1]);
  const x0 = Math.min(...xs) - 18, x1 = Math.max(...xs) + 18, y0 = Math.min(...ys) - 18, y1 = Math.max(...ys) + 18;
  return `${x0} ${y0} ${x1-x0} ${y1-y0}`;
}
function mDraw(){

  const max = Math.max(1, ...Object.values(counts));
  const ids = Object.keys(counts).filter(id => counts[id] > 0 && G.pts[id]).sort((a, b) => counts[a] - counts[b]);
  const zw = mState.zoom === 'world' ? 1 : .45;
  const shapes = Object.entries(G.countries).map(([id, d]) => {

  }).join('');
  const arcs = ids.map(id => { const a = arcPath(G.origin, G.pts[id]); const w = (.8 + 4.5 * Math.sqrt(counts[id] / max)) * zw;
    return `<path class="arc${id === mState.sel ? ' sel' : ''}" d="${a.d}" style="--len:${a.len};stroke-width:${w.toFixed(2)}"/>`; }).join('');
  const dots = ids.map(id => { const [x, y] = G.pts[id], r = (2.2 + 6 * Math.sqrt(counts[id] / max)) * zw;
    return `<circle class="dot${id === mState.sel ? ' sel' : ''}" cx="${x}" cy="${y}" r="${r.toFixed(2)}"/><circle class="hit" data-c="${id}" cx="${x}" cy="${y}" r="${Math.max(r, 9 * zw).toFixed(2)}"><title>${esc(cById(id).name)}: ${bnNum(counts[id])}${T(' জন', ' people')}</title></circle>`; }).join('');
  const total = users ? Object.values(counts).reduce((a, b) => a + b, 0) : 0;
  box.innerHTML = `<svg viewBox="${zoomBox()}" role="img" aria-label="${T('বাংলাদেশ থেকে বিভিন্ন দেশে যাওয়ার মানচিত্র','Map of journeys from Bangladesh to other countries')}"><path class="land" d="${G.base}"/>${shapes}<path class="bdshape" d="${G.bd}"/>${arcs}${dots}<circle class="ring" cx="${G.origin[0]}" cy="${G.origin[1]}" r="${3*zw}"/><circle class="origin" cx="${G.origin[0]}" cy="${G.origin[1]}" r="${3*zw}"/></svg>
    <div class="mzoom">${[['world',T('পুরো পৃথিবী','Whole world')],['near',T('মধ্যপ্রাচ্য ও এশিয়া','Middle East and Asia')]].map(([k, v]) => `<button type="button" data-zoom="${k}" aria-pressed="${mState.zoom === k}">${v}</button>`).join('')}</div>
    ${users && !total ? `<div class="mempty">${mState.dist ? T(esc(DIST[mState.dist]) + ' থেকে এখনো কেউ জানাননি।', 'Nobody from ' + esc(DIST[mState.dist]) + ' has answered yet.') : T('এখনো কেউ জানাননি।','Nobody has answered yet.')} ${T('আপনিই প্রথম হোন!','Be the first!')}</div>` : ''}`;

/* wrap Bangla digit runs in .d so they use the body font */
function fixDigits(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while(w.nextNode()){ const n = w.currentNode; if(/[০-৯]/.test(n.nodeValue) && !n.parentElement.closest('script,style,.d,input,textarea,option,svg')) nodes.push(n); }
  nodes.forEach(n => {
    const frag = document.createDocumentFragment();
    n.nodeValue.split(/([০-৯][০-৯,.]*)/).forEach((part,i) => {
      if(i % 2){ const s = document.createElement('span'); s.className = 'd'; s.textContent = part; frag.appendChild(s); }
      else if(part) frag.appendChild(document.createTextNode(part));
    });
    n.replaceWith(frag);
  });
}

      const ta = document.createElement('textarea'); ta.value = url; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
      let ok=false; try{ ok=document.execCommand('copy') }catch(_){} ta.remove();
      toast(ok ? T('লিংক কপি হয়েছে','Link copied') : url);
    }
  });
}
/* home lives at the plain address (dalalnaki.com, no #home) */
function goHome(){ history.pushState(null, '', location.pathname + location.search); route(); }
backBtn.addEventListener('click', () => {
  const h = (location.hash||'').slice(1);
  if(h.startsWith('c-')) location.hash = 'countries'; else goHome();
});
document.addEventListener('click', e => {
  const a = e.target.closest('a[href="/"]');
  if(!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
  e.preventDefault(); if(location.hash) goHome(); else window.scrollTo(0,0);
});
if(location.hash === '#home') history.replaceState(null, '', location.pathname + location.search);
addEventListener('hashchange', route);
addEventListener('popstate', () => { if(!location.hash) route(); });

/* ---------- read aloud: only the "সবগুলো শুনুন" button on #check (needs a Bangla voice on the phone) ---------- */
let bnVoice = null;
function findVoice(){ if('speechSynthesis' in window) bnVoice = speechSynthesis.getVoices().find(v => /^bn/i.test(v.lang)) || null; }
function speakText(t){
  if(!bnVoice) return; speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.voice = bnVoice; u.lang = bnVoice.lang; u.rate = .95; speechSynthesis.speak(u);
}
function stopSpeak(){ if('speechSynthesis' in window) speechSynthesis.cancel(); }
if('speechSynthesis' in window){ findVoice(); speechSynthesis.addEventListener?.('voiceschanged', findVoice); }

document.getElementById('foot').innerHTML = foot();
route();
})();
</script>
