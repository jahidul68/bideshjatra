<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>দালাল নাকি? — বিদেশযাত্রা যাচাই</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="বিদেশে কাজে যাওয়ার আগে সরকারি খরচ, এজেন্সির লাইসেন্স ও দালালের কথা যাচাই করুন।">
<meta name="theme-color" content="#fbfcfa">
<script>try{var t=JSON.parse(localStorage.getItem("theme"));if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}
try{var q=(location.search.match(/[?&]lang=(en|bn)\b/)||[])[1];if(q)localStorage.setItem("lang",JSON.stringify(q));if((q||JSON.parse(localStorage.getItem("lang")))==="en"){document.documentElement.lang="en";document.title="Dalal Naki? Check before you go abroad"}}catch(e){}</script>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow mobile column, like a checklist booklet a family can pass around; status shown as passport-style stamps. */
:root{
  --paper:#f2f5f3; --card:#ffffff; --ink:#13211c; --muted:#56665f; --line:#d3ddd8;
  --brand:#0b5d4b; --brand-ink:#ffffff; --brand-soft:#dfeee8;
  --stamp:#c0352c; --stamp-soft:#fbe6e3;
  --amber:#a8650a; --amber-soft:#fbefd9;
  --ok:#1a7845; --ok-soft:#e1f2e7;
  --display:'Noto Sans Bengali',system-ui,sans-serif;
  --body:'Noto Sans Bengali',system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1613; --card:#16211c; --ink:#e5eee9; --muted:#9aaca4; --line:#28362f;
  --brand:#52c29c; --brand-ink:#05201a; --brand-soft:#173a30;
  --stamp:#ff7d70; --stamp-soft:#3a1b18;
  --amber:#f0b45c; --amber-soft:#3a2a10;
  --ok:#66d396; --ok-soft:#173526; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1613; --card:#16211c; --ink:#e5eee9; --muted:#9aaca4; --line:#28362f;
  --brand:#52c29c; --brand-ink:#05201a; --brand-soft:#173a30;
  --stamp:#ff7d70; --stamp-soft:#3a1b18;
  --amber:#f0b45c; --amber-soft:#3a2a10;
  --ok:#66d396; --ok-soft:#173526; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;margin:0}
a{color:var(--brand)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--brand);color:var(--brand-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.back{width:42px;height:42px;border-radius:12px;border:0;background:color-mix(in srgb,var(--brand-ink) 14%,transparent);color:var(--brand-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.back[hidden]{display:none}
.back svg{width:22px;height:22px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;flex:1;min-width:0;text-decoration:none;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{display:block;font-family:var(--body);font-weight:600;font-size:12.5px;opacity:.85;overflow:hidden;text-overflow:ellipsis}
.speak{height:42px;padding:0 14px;border-radius:12px;border:0;background:color-mix(in srgb,var(--brand-ink) 14%,transparent);color:var(--brand-ink);display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;font-size:15px;flex:none}
.speak svg{width:20px;height:20px}

main{padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}

.proto{font-size:14px;color:var(--amber);background:var(--amber-soft);border-radius:12px;padding:10px 14px;display:flex;gap:8px;align-items:flex-start}

/* home */
.hero h1{font-size:clamp(28px,7.5vw,36px);font-weight:800}
.hero p{margin:8px 0 0;color:var(--muted)}
/* live pace strip (home) */
.pace{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;display:grid;gap:8px}
.pace .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0;font-size:16px}
.pace .live{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--stamp)}
.pace .live i{width:8px;height:8px;border-radius:50%;background:var(--stamp);animation:pacePulse 1.6s ease-out infinite}
.pace .cnt{font-family:var(--display);font-size:30px;font-weight:800;color:var(--brand);line-height:1;display:inline-block}
.pace .cnt.bump{animation:paceBump .6s ease-out}
.pace .lane{display:flex;align-items:center;gap:12px;height:30px;margin:2px 0}
.pace .end{flex:none;font-size:12px;color:var(--muted)}
.pace .flight{position:relative;flex:1;min-width:0;height:100%}
.pace .flight::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--line)}
.pace .plane{position:absolute;top:50%;left:13px;width:26px;height:26px;margin:-13px 0 0 -13px;color:var(--brand);animation:paceFly linear infinite}
.pace .plane svg{width:100%;height:100%;display:block}
.pace .clock{margin:-4px 0 0;font-size:14px;color:var(--muted)}
.pace .sub{margin:0;font-size:14px;color:var(--muted)}
.pace .sub a{white-space:nowrap}
@keyframes paceFly{0%{left:13px;opacity:0}6%{opacity:1}94%{opacity:1}100%{left:calc(100% - 13px);opacity:0}}
@keyframes paceBump{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes pacePulse{0%{box-shadow:0 0 0 0 var(--stamp)}100%{box-shadow:0 0 0 8px transparent}}
@media (prefers-reduced-motion:reduce){.pace .plane,.pace .live i,.pace .cnt.bump{animation:none}.pace .plane{left:50%;margin-left:-13px}}
.steps3{display:grid;gap:12px}
.big{display:grid;grid-template-columns:56px 1fr 24px;gap:14px;align-items:center;text-align:left;width:100%;
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.big:hover{border-color:var(--brand)}
.big:active{transform:scale(.99)}
.big .num{width:56px;height:56px;border-radius:14px;background:var(--brand-soft);color:var(--brand);font-family:var(--display);font-weight:800;font-size:30px;display:grid;place-items:center}
.big b{font-family:var(--display);font-size:21px;font-weight:700;display:block;line-height:1.25}
.big span{color:var(--muted);font-size:15px;display:block;margin-top:2px}
.big .arr{color:var(--muted)}
.callstrip{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px dashed var(--line);border-radius:var(--r);padding:14px 16px}
.callstrip .n{font-family:var(--display);font-size:28px;font-weight:800;color:var(--brand);letter-spacing:.02em;user-select:all}
.callstrip p{margin:0;font-size:15px;color:var(--muted);min-width:0}

/* countries */
.search{width:100%;font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cbtn{display:flex;align-items:center;gap:10px;padding:14px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);font-weight:600;font-size:17px;min-width:0}
.cbtn:hover{border-color:var(--brand)}
.cbtn .f{line-height:0;flex:none}
.fimg{height:auto;vertical-align:middle;border-radius:3px;box-shadow:0 0 0 1px var(--line)}
.cbtn .fimg{width:36px}
h1 .fimg{width:40px;margin-right:4px}
.meta .fimg{width:20px}
.cbtn .nm{min-width:0;overflow-wrap:anywhere}
.empty{color:var(--muted);text-align:center;padding:20px}

/* sections */
.sec{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;min-width:0}
.sec h2{font-size:21px;font-weight:700}
.label{font-size:14px;color:var(--muted);font-weight:600}
.money{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,44px);line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums}
.money small{font-size:.5em;font-weight:700;color:var(--muted)}
.src{font-size:13.5px;color:var(--muted)}
.src a{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;padding:3px 10px;border-radius:999px;width:max-content;max-width:100%}
.b-official{background:var(--ok-soft);color:var(--ok)}
.b-news{background:var(--amber-soft);color:var(--amber)}
.b-draft{background:var(--amber-soft);color:var(--amber)}

/* money gap bar */
.gap{display:grid;gap:10px;margin-top:4px}
.row{display:grid;gap:4px}
.row .t{display:flex;justify-content:space-between;gap:10px;font-size:15px;flex-wrap:wrap}
.row .t b{font-variant-numeric:tabular-nums}
.track{height:16px;border-radius:8px;background:var(--paper);position:relative;overflow:hidden}
.fill{position:absolute;top:0;bottom:0;border-radius:8px}
.fill.cap{background:var(--brand);left:0}
.fill.rep{background:repeating-linear-gradient(135deg,var(--stamp) 0 6px,color-mix(in srgb,var(--stamp) 70%,transparent) 6px 12px)}
.gapnote{font-size:15px;background:var(--stamp-soft);color:var(--ink);border-radius:12px;padding:10px 12px}
.gapnote b{color:var(--stamp)}

.warn{background:var(--stamp-soft);border:1.5px solid color-mix(in srgb,var(--stamp) 40%,transparent);border-radius:var(--r);padding:16px;display:grid;gap:6px}
.warn b{color:var(--stamp);font-family:var(--display);font-size:19px}

/* checklist */
.check{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.check li{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;padding:10px;border-radius:12px;background:var(--paper)}
.check input{appearance:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);background:var(--card);cursor:pointer;margin:2px 0 0;display:grid;place-items:center}
.check input:checked{background:var(--ok);border-color:var(--ok)}
.check input:checked::after{content:"";width:8px;height:14px;border:solid var(--card);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check label{cursor:pointer;min-width:0}
.check label b{display:block;font-weight:700}
.check label span{display:block;color:var(--muted);font-size:15px}
.check li.done label b{text-decoration:line-through;text-decoration-color:var(--ok)}
.progress{font-size:14px;color:var(--muted);font-weight:600}

.fees{display:grid;gap:8px}
.fee{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;border-bottom:1px dashed var(--line);padding-bottom:8px}
.fee:last-child{border-bottom:0;padding-bottom:0}
.fee b{font-variant-numeric:tabular-nums;font-size:18px}

/* agency */
.rlform{display:flex;gap:8px}
.rlwrap{display:flex;align-items:center;flex:1;min-width:0;border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding-left:14px}
.rlwrap span{font-weight:700;color:var(--muted)}
.rlwrap input{flex:1;min-width:0;width:100%;border:0;background:transparent;font:inherit;font-size:22px;font-weight:600;padding:12px 10px;color:var(--ink);letter-spacing:.05em}
.rlwrap input:focus{outline:none}
.rlwrap:focus-within{border-color:var(--brand)}
.btn{border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:18px;padding:0 20px;cursor:pointer;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:var(--card);color:var(--brand);border:1.5px solid var(--brand)}
.btn.wide{width:100%}
/* offer check (#check) */
.ocfacts{display:grid;gap:12px;list-style:none;margin:0;padding:0}
.ocfact{display:grid;grid-template-columns:44px 1fr;gap:12px;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--amber);border-radius:var(--r);padding:16px}
.ocfact.high{border-left-color:var(--stamp)}
.ocfact.hit{background:var(--stamp-soft);border-color:var(--stamp)}
.ocfact .ic{font-size:34px;line-height:1.1;text-align:center}
.ocfact h3{font-size:20px;font-weight:700;line-height:1.35}
.ocfact p{margin:4px 0 0}
.ocmine{display:flex;gap:10px;align-items:center;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--paper);cursor:pointer;font-weight:600}
.ocmine input{appearance:none;flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);background:var(--card);cursor:pointer;margin:0;display:grid;place-items:center}
.ocmine input:checked{background:var(--stamp);border-color:var(--stamp)}
.ocmine input:checked::after{content:"";width:8px;height:14px;border:solid var(--card);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.occta{display:grid;grid-template-columns:auto 1fr 24px;gap:14px;align-items:center;text-decoration:none;color:var(--brand-ink);background:var(--brand);border-radius:var(--r);padding:18px}
.occta .ic{font-size:34px;line-height:1}
.occta b{font-family:var(--display);font-size:23px;font-weight:800;display:block;line-height:1.2}
.occta span span{display:block;font-size:15px;opacity:.9;margin-top:2px}
.occta .arr{color:var(--brand-ink)}
.ocq{display:grid;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:20px}
.ocbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.ocbar i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .2s}
.ocstep{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ocicon{font-size:52px;text-align:center;line-height:1.1}
.ocq h2{font-size:23px;font-weight:700;line-height:1.4}
.ocans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ocans .btn{min-height:60px;font-size:21px}
.ocans .dk{grid-column:1/-1;min-height:48px;font-size:17px}
.ocsay{border:0;background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:6px 12px;font-weight:700;font-size:15px;cursor:pointer}
.ocwhy{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.ocwhy li{background:var(--card);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.ocwhy b{display:block}
.result.mid{border-color:var(--amber);background:var(--amber-soft)}
.ocnext{display:grid;gap:10px}
.oclink{border:0;background:none;color:var(--brand);font-weight:700;font-size:16px;cursor:pointer;padding:6px 0;justify-self:start}
.result{display:grid;gap:10px;padding:18px;border-radius:var(--r);border:2px solid var(--line);background:var(--card);position:relative;overflow:hidden}
.result.bad{border-color:var(--stamp);background:var(--stamp-soft)}
.stamp{justify-self:start;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.04em;padding:2px 14px;border:3px double currentColor;border-radius:8px;transform:rotate(-4deg);opacity:.92}
.stamp.red{color:var(--stamp)}
.stamp.amber{color:var(--amber)}
.stamp.green{color:var(--ok)}
.result.good{border-color:var(--ok);background:var(--ok-soft)}
.result.warn2{border-color:var(--amber);background:var(--amber-soft)}
.ol{margin:0;padding-left:1.3em;display:grid;gap:8px}
.statuses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.st{border-radius:12px;padding:10px 12px;font-size:15px}
.st b{display:block;font-size:16px}
.st.g{background:var(--ok-soft)} .st.g b{color:var(--ok)}
.st.r{background:var(--stamp-soft)} .st.r b{color:var(--stamp)}
.note{font-size:15px;color:var(--muted);border-left:3px solid var(--amber);padding-left:12px}

/* flags */
.flag{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.flag summary{list-style:none;cursor:pointer;padding:16px 16px 16px 18px;display:grid;grid-template-columns:1fr 24px;gap:10px;align-items:center}
.flag summary::-webkit-details-marker{display:none}
.flag summary q{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.35;quotes:"“" "”"}
.flag summary svg{width:22px;height:22px;color:var(--muted);transition:transform .2s}
.flag[open] summary svg{transform:rotate(180deg)}
.flag .body{padding:0 18px 16px;display:grid;gap:8px}
.flag .todo{background:var(--brand-soft);border-radius:10px;padding:10px 12px;font-weight:600}
.contact{display:grid;gap:4px;padding:12px 0;border-bottom:1px dashed var(--line)}
.contact:last-child{border-bottom:0}
.contact .ph{font-family:var(--display);font-size:24px;font-weight:800;color:var(--brand);user-select:all}
.contact .pending{font-size:14px;color:var(--amber)}

.share{display:flex;gap:10px;flex-wrap:wrap}
.share .btn{flex:1 1 150px;font-size:16px;white-space:nowrap}

footer{max-width:560px;margin:8px auto 0;font-size:13.5px;color:var(--muted);display:grid;gap:8px}
footer ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
footer a{color:var(--muted);overflow-wrap:anywhere}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}

.news{background:var(--stamp-soft);border:1px solid var(--stamp);border-radius:var(--r);padding:14px 16px;margin:14px 0}
.news h2{font-size:19px;color:var(--stamp);margin-bottom:8px}
.news ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.news li{display:grid;gap:2px}
.news .nd{font-size:14px;color:var(--muted)}
.news a{font-weight:600}
.news .more{display:inline-block;margin-top:10px;font-size:15px}
/* Bangla digits always use Noto Sans Bengali (loaded above) */
span.d{font-family:'Noto Sans Bengali',var(--body)!important;font-weight:inherit!important;font-size:inherit!important;color:inherit!important;display:inline!important;margin:0!important}

/* text size */
main,footer{zoom:var(--zoom,1)}

/* visa / labour-market access labels */
.acc{display:inline-block;font-size:13px;font-weight:700;padding:1px 9px;border-radius:999px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.cbtn .acc{display:table;margin:3px 0 0}
.acc.open{background:var(--ok);color:var(--card)}
.acc.limited{background:var(--amber);color:var(--card)}
.acc.closed{background:var(--stamp);color:var(--card)}
.acc.unknown{background:var(--line);color:var(--ink)}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.legend .acc{margin:0}
.legend .src{flex-basis:100%}
.accbox{border-radius:var(--r);padding:14px 16px;display:grid;gap:6px;border:1.5px solid var(--line);background:var(--card)}
.accbox .acc{margin:0}
.accbox.open{border-color:var(--ok);background:var(--ok-soft)}
.accbox.limited{border-color:var(--amber);background:var(--amber-soft)}
.accbox.closed{border-color:var(--stamp);background:var(--stamp-soft)}

/* visitor counter + credit */
.visitors{position:fixed;right:10px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:8;font-size:12.5px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px;opacity:.92}
.visitors b{color:var(--brand)}
.credit{text-align:center;font-size:13px}
@media (min-width:860px){.visitors{bottom:12px}}

/* two-column home on wide screens */
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.col-main,.col-news{display:grid;gap:16px;align-content:start;min-width:0}
.topnav{display:none}
@media (min-width:860px){
  body.wide .page,body.wide footer,body.wide .bar-in{max-width:1080px}
  .split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
  .col-news{position:sticky;top:76px}
  nav.tabs{display:none}
  main{padding-bottom:40px!important}
  .topnav{display:flex;gap:4px;margin-left:auto}
  .topnav a{padding:8px 14px;border-radius:10px;text-decoration:none;color:var(--brand-ink);font-weight:600;font-size:16px;opacity:.85}
  .topnav a:hover{background:color-mix(in srgb,var(--brand-ink) 14%,transparent);opacity:1}
  .topnav a[aria-current="page"]{background:color-mix(in srgb,var(--brand-ink) 22%,transparent);opacity:1}
  .brand{flex:none}
  .bar-in{max-width:1080px}
  .page{max-width:760px}
}

/* bottom tabs (phones only) */
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1.5px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:flex;width:100%;max-width:560px}
.tabs a{flex:1;min-width:0;display:grid;justify-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:600}
.tabs a .ic{font-size:22px;line-height:1.1}
.tabs a[aria-current="page"]{color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}

/* updates tracker */
.upd{background:var(--card);border:1.5px solid var(--line);border-left-width:6px;border-radius:var(--r);padding:14px 16px;display:grid;gap:6px}
.upd.urgent{border-left-color:var(--stamp)} .upd.change{border-left-color:var(--amber)} .upd.info{border-left-color:var(--brand)}
.upd h3{font-size:19px}
.shr{margin-top:4px}
.shr summary{list-style:none;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--brand);cursor:pointer;min-height:36px;width:max-content}
.shr summary::-webkit-details-marker{display:none}
.shr summary svg{width:16px;height:16px}
.shr[open] summary{border-color:var(--brand);background:var(--brand-soft)}
.shr-opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.shr button{font:inherit;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:36px}
.shr button:hover{border-color:var(--brand)}
.shr .fb{color:#1877f2} .shr .wa{color:var(--ok)} .shr .pc{color:var(--brand)}
.pcov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:16px}
.pcov[hidden]{display:none}
.pcbox{background:var(--card);border-radius:var(--r);padding:14px;max-width:420px;width:100%;max-height:92vh;overflow:auto;display:grid;gap:10px}
.pcbox img{width:100%;border-radius:10px;border:1px solid var(--line)}
.pcbox .row{display:flex;gap:8px;flex-wrap:wrap}
.pcbox .row .btn{flex:1 1 140px}
.upd .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.chip{font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px}
.chip.urgent{background:var(--stamp-soft);color:var(--stamp)} .chip.change{background:var(--amber-soft);color:var(--amber)} .chip.info{background:var(--brand-soft);color:var(--brand)} .chip.new{background:var(--ok);color:var(--card)}
.upd .todo{background:var(--brand-soft);border-radius:10px;padding:8px 12px;font-weight:600}
.updstrip{display:grid;gap:8px}
.updstrip h2{font-size:19px}

/* region filter on the country list */
.regs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.regs button{flex:none;font:inherit;font-size:15px;font-weight:600;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:40px}
.regs button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.reghd{grid-column:1/-1;font-size:18px;font-weight:700;margin:8px 0 -2px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.reghd small{font-family:var(--body);font-size:14px;font-weight:600}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--paper);border-radius:12px;padding:12px;display:grid;gap:2px;align-content:start;min-width:0}
.tile .v{font-family:var(--display);font-weight:800;font-size:clamp(22px,6vw,28px);line-height:1.15;color:var(--ink)}
.tile .l{font-size:14px;color:var(--muted);font-weight:600;line-height:1.35}
.tile .nt{font-size:13px;color:var(--muted)}
.tile .src{font-size:12px}
.tile.danger{background:var(--stamp-soft)} .tile.danger .v{color:var(--stamp)}

/* horizontal bar chart (single series) */
.bars{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.bars li{display:grid;gap:3px}
.bars .t{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.bars .t a{color:var(--ink);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:6px}
.bars .t a .fimg{width:22px}
.bars .t b{font-variant-numeric:tabular-nums;white-space:nowrap}
.bars .tr{height:12px;border-radius:0 6px 6px 0;background:var(--paper)}
.bars .fl{height:100%;border-radius:0 4px 4px 0;background:var(--brand);min-width:3px}
.bars .fl.irr{background:var(--stamp)}
.bars li:hover .fl{filter:brightness(1.15)}

/* risk page */
.riskhero{background:var(--stamp);color:#fff;border-radius:var(--r);padding:20px;display:grid;gap:8px}
.riskhero h1{font-size:clamp(26px,7vw,34px);font-weight:800}
.riskhero p{margin:0;opacity:.95}
.route{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:rt}
.route li{position:relative;padding:0 0 18px 46px;counter-increment:rt}
.route li::before{content:counter(rt);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--stamp);color:#fff;font-family:var(--display);font-weight:800;display:grid;place-items:center}
.route li::after{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:2px;background:color-mix(in srgb,var(--stamp) 35%,transparent)}
.route li:last-child{padding-bottom:0} .route li:last-child::after{display:none}
.route b{display:block;font-family:var(--display);font-size:18px}
.rcard{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.rcard h3{font-size:17px}
.inc{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.inc li{border-left:3px solid var(--stamp);padding-left:12px}
.inc .nd{font-size:14px;color:var(--muted)}
.riskbanner{display:grid;grid-template-columns:auto 1fr 24px;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--stamp-soft);border:1.5px solid var(--stamp);border-radius:var(--r);padding:16px}
.riskbanner .ic{font-size:30px;line-height:1}
.riskbanner b{font-family:var(--display);font-size:20px;color:var(--stamp);display:block;line-height:1.25}
.riskbanner span span{display:block;font-size:15px;color:var(--muted)}
.big.red .num{background:var(--stamp-soft);color:var(--stamp)}
.dtable{width:100%;border-collapse:collapse;font-size:15px}
.dtable th,.dtable td{text-align:left;padding:8px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
.dtable th{font-size:13.5px;color:var(--muted)}
.dtable td a{color:var(--ink);font-weight:600;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.dtable .fimg{width:22px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* home: 3 main steps + small "more" tiles */
.big.main{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.big.main .num{background:color-mix(in srgb,var(--brand-ink) 18%,transparent);color:var(--brand-ink)}
.big.main span,.big.main .arr{color:var(--brand-ink)} .big.main span span{opacity:.9}
.more-sec{display:grid;gap:10px}
.more-sec h2{font-size:19px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile2{display:grid;gap:4px;align-content:start;padding:12px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);min-width:0}
.tile2:hover{border-color:var(--brand)}
.tile2 .ic{font-size:24px;line-height:1.2}
.tile2 b{font-size:15.5px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.tile2.red{background:var(--stamp-soft);border-color:color-mix(in srgb,var(--stamp) 45%,transparent)} .tile2.red b{color:var(--stamp)}
.updmini{display:grid;gap:4px;padding:12px 14px;background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--brand);border-radius:12px;text-decoration:none;color:var(--ink)}
.updmini.urgent{border-left-color:var(--stamp)} .updmini.change{border-left-color:var(--amber)}
.updmini .meta{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
.updmini b{font-size:16.5px;line-height:1.35}
.updmini .more{font-size:14px;color:var(--brand);font-weight:600}
.navmore{position:relative}
.navmore summary{list-style:none;padding:8px 14px;border-radius:10px;color:var(--brand-ink);font-weight:600;font-size:16px;opacity:.85;cursor:pointer}
.navmore summary::-webkit-details-marker{display:none}
.navmore[open] summary,.navmore summary:hover{background:color-mix(in srgb,var(--brand-ink) 14%,transparent);opacity:1}
.navpanel{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px;display:grid;min-width:230px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:20}
.topnav .navpanel a{color:var(--ink);opacity:1;padding:9px 12px}
.topnav .navpanel a:hover{background:var(--brand-soft)}
/* payment diary (#ledger) */
.lgf{display:grid;gap:12px}
.lgf label{display:grid;gap:4px;font-size:15px;font-weight:600;color:var(--muted);min-width:0}
.lgf input,.lgf select,.lgf textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.lgf input:focus,.lgf select:focus,.lgf textarea:focus{outline:none;border-color:var(--brand)}
.lgf textarea{min-height:90px;resize:vertical}
.lg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lghint{font-size:14px;font-weight:600}
.lghint.ok{color:var(--ok)} .lghint.bad{color:var(--stamp)} .lghint.mid{color:var(--amber)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.pays{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pays li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--paper)}
.pays .a{font-family:var(--display);font-weight:800;font-size:20px}
.pays .m{font-size:14px;color:var(--muted);grid-column:1}
.pays .x{grid-row:1/3;grid-column:2;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;width:40px;height:40px;border-radius:10px}
.pays .x:hover{background:var(--stamp-soft);color:var(--stamp)}
.pays .nr{color:var(--stamp);font-weight:700}
.meter{display:grid;gap:8px}
.meter .track{height:22px;border-radius:11px}
.meter .capmark{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink);border-radius:2px}
.lgflags{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lgflags li{padding:10px 12px;border-radius:12px;font-size:15.5px}
.lgflags li.r{background:var(--stamp-soft)} .lgflags li.r b{color:var(--stamp)}
.lgflags li.a{background:var(--amber-soft)} .lgflags li.a b{color:var(--amber)}
.lgflags li.g{background:var(--ok-soft)} .lgflags li.g b{color:var(--ok)}
.letter{background:#fff;color:#111;border:1.5px solid var(--line);border-radius:12px;padding:22px 20px;font-size:16px;line-height:1.75;white-space:normal}
.letter p{margin:0 0 10px}
.letter table{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:15px}
.letter th,.letter td{border:1px solid #999;padding:5px 7px;text-align:left}
.letter .sign{margin-top:28px}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  #lgLetter,#lgLetter *{visibility:visible}
  #lgLetter{position:absolute;left:0;top:0;width:100%;border:0;padding:0}
  .bar,.tabs,.visitors,.toast{display:none}
}

/* #map: "কোথা থেকে, কোথায়?" */
.mhead{display:grid;gap:6px}
.mhead h1{font-size:30px}
.mhead p{margin:0;color:var(--muted)}
.mtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mseg{display:flex;flex-wrap:wrap;gap:6px}
.mseg button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:15px;cursor:pointer;min-height:40px}
.mseg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.mdist{font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;min-height:40px;max-width:100%}
.mdist:disabled{opacity:.5}
.mapbox{scroll-margin-top:84px;position:relative;background:color-mix(in srgb,var(--brand-soft) 45%,var(--card));border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation;transition:none}
.mapbox .land{fill:color-mix(in srgb,var(--muted) 16%,var(--card))}
.mapbox .dest{fill:color-mix(in srgb,var(--muted) 24%,var(--card));cursor:pointer;stroke:var(--card);stroke-width:.4}
.mapbox .dest:hover{filter:brightness(.92)}
.mapbox .dest.sel{stroke:var(--stamp);stroke-width:1.4}
.mapbox .bdshape{fill:var(--stamp)}
.mapbox .arc{fill:none;stroke:var(--amber);stroke-linecap:round;opacity:.8;pointer-events:none;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:mdraw 1.1s ease-out forwards}
.mapbox .arc.sel{stroke:var(--stamp);opacity:1}
@keyframes mdraw{to{stroke-dashoffset:0}}
.mapbox .dot{fill:var(--brand);stroke:var(--card);stroke-width:1;pointer-events:none}
.mapbox .dot.sel{fill:var(--stamp)}
.mapbox .hit{fill:transparent;cursor:pointer}
.mapbox .origin{fill:var(--stamp);stroke:var(--card);stroke-width:1.5}
.mapbox .ring{fill:none;stroke:var(--stamp);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:mring 2s ease-out infinite}
@keyframes mring{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.mapbox .arc{animation:none;stroke-dashoffset:0}.mapbox .ring{animation:none;opacity:0}}
.mzoom{position:absolute;left:8px;bottom:8px;display:flex;gap:6px}
.mzoom button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:4px 10px;font-size:13.5px;font-weight:600;cursor:pointer}
.mzoom button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand)}
.mload{padding:60px 16px;text-align:center;color:var(--muted)}
.mempty{position:absolute;inset:auto 8px 46px;background:var(--card);border:1.5px solid var(--amber);border-radius:12px;padding:8px 12px;font-size:14.5px;text-align:center}
.mtotal{font-size:14.5px;color:var(--muted);text-align:center}
.mtotal b{color:var(--ink)}
.mpanel[hidden]{display:none}
.mpanel h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mpanel h2 .fimg{width:30px}
.mpanel h2 a{margin-left:auto;font-family:var(--body);font-size:15px;font-weight:600}
.mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.mstats div{background:var(--paper);border-radius:12px;padding:8px 12px;display:grid}
.mstats b{font-family:var(--display);font-size:24px;line-height:1.2}
.mstats span{font-size:13.5px;color:var(--muted)}
.mpick{all:unset;display:grid;gap:3px;cursor:pointer;border-radius:8px}
.mpick:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.mpick .t span{font-weight:600;display:flex;align-items:center;gap:6px}
.mpick .t span .fimg{width:22px}
.mpick[aria-pressed="true"] .fl{background:var(--stamp)}
.mf .pills{display:flex;flex-wrap:wrap;gap:8px}
.mf .pills label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--ink);font-size:16px;white-space:nowrap}
.mf .pills label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.mf .pills input{accent-color:var(--brand);margin:0}
.mf fieldset{border:0;margin:0;padding:0;display:grid;gap:6px;min-width:0}
.mf legend{font-size:15px;font-weight:600;color:var(--muted);padding:0;margin-bottom:6px}
.mf .opt{border-top:1.5px dashed var(--line);padding-top:12px;display:grid;gap:10px}
.mf .amtv{font-size:15px;color:var(--brand);font-weight:700;min-height:1.4em}
.mf .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.mthanks{display:grid;gap:10px;background:var(--ok-soft);border:1.5px solid var(--ok);border-radius:var(--r);padding:16px}
.mthanks h2{color:var(--ok)}
.mthanks .row2{display:flex;flex-wrap:wrap;gap:8px}
.mthanks .row2 .btn{flex:1 1 140px;font-size:16px}
.mapcta{display:grid;grid-template-columns:auto 1fr 24px;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--amber-soft);border:1.5px solid var(--amber);border-radius:var(--r);padding:16px}
.mapcta .ic{font-size:34px;line-height:1}
.mapcta b{display:block;font-family:var(--display);font-size:20px}
.mapcta span span{font-size:15px;color:var(--muted)}
.mapcta .arr svg{width:22px;height:22px;color:var(--amber)}
.crowd{display:grid;gap:6px;border-top:1.5px dashed var(--line);padding-top:10px}

/* ===== Theme: form paper, newspaper headlines, one rubber stamp =====
   Overrides the base look above. Cards are paper slips (small radius, hairline border),
   headlines use Noto Sans Bengali (clearest on phones), links are ballpoint blue, the logo is the stamp. */
:root{
  --paper:#eef1ec; --card:#fbfcfa; --ink:#18221d; --muted:#55615b; --line:#cfd6d0;
  --brand:#0e4a3b; --brand-ink:#ffffff; --brand-soft:#e2ebe6;
  --stamp:#b42d25; --stamp-soft:#f7e4e1; --amber:#94580a; --amber-soft:#f6ecd9;
  --pen:#21408f;
  --display:'Noto Sans Bengali',system-ui,sans-serif; --body:'Noto Sans Bengali',system-ui,sans-serif;
  --r:5px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#101613; --card:#18201c; --ink:#e6ece8; --muted:#9aa8a1; --line:#2c3732;
  --brand:#6cc3a2; --brand-ink:#06201a; --brand-soft:#1b3129; --stamp:#ff8a7c; --stamp-soft:#3a1d1a;
  --amber:#e9b25e; --amber-soft:#3a2b12; --pen:#9db4ff}}
:root[data-theme="dark"]{
  --paper:#101613; --card:#18201c; --ink:#e6ece8; --muted:#9aa8a1; --line:#2c3732;
  --brand:#6cc3a2; --brand-ink:#06201a; --brand-soft:#1b3129; --stamp:#ff8a7c; --stamp-soft:#3a1d1a;
  --amber:#e9b25e; --amber-soft:#3a2b12; --pen:#9db4ff; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
.themeb{width:42px;height:42px;border:0;border-radius:6px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;cursor:pointer;flex:none}
.themeb svg{width:21px;height:21px}
.langb{height:42px;min-width:42px;padding:0 10px;border:0;border-radius:6px;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:15px;cursor:pointer;flex:none;letter-spacing:.02em}
.themeb .sun{display:none}
.isdark .themeb .sun{display:block} .isdark .themeb .moon{display:none}
body{font-size:17.5px;line-height:1.65}
a{color:var(--pen)}
h1,h2,h3{letter-spacing:-.005em}
.hero h1{font-weight:900;font-size:clamp(30px,8vw,40px);line-height:1.18}
.sec h2,.mpanel h2{font-size:21px;font-weight:800}

/* masthead: paper, green rule, stamp logo */
body::before{background:var(--card)}
.bar{background:var(--card);color:var(--ink);border-bottom:3px solid var(--brand);padding-block:8px}
.brand{flex:none;margin-right:auto;color:var(--stamp);display:inline-grid;justify-items:center;padding:1px 12px 3px;border:3px double currentColor;border-radius:6px;transform:rotate(-2.5deg);font-size:21px;font-weight:900;line-height:1.15;white-space:nowrap}
.brand-sub{font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:.02em;opacity:1;border-top:1px solid currentColor;margin-top:1px;padding-top:1px}
.back{background:var(--brand-soft);color:var(--brand);border-radius:6px}
@media (min-width:860px){
  .topnav a,.navmore summary{color:var(--ink);opacity:1;border-radius:4px}
  .topnav a:hover,.navmore[open] summary,.navmore summary:hover{background:var(--brand-soft)}
  .topnav a[aria-current="page"]{background:none;color:var(--brand);box-shadow:inset 0 -3px 0 var(--brand)}
}

/* slips instead of soft cards */
.sec,.big,.callstrip,.flag,.upd,.ocfact,.ocq,.result,.accbox,.warn,.news,.riskbanner,.mapcta,.tile2,.updmini,.cbtn,.mapbox,.pcbox,.letter{border-width:1px;border-radius:var(--r)}
.sec{padding:18px 18px 20px}
.tile,.check li,.pays li,.mstats div,.st,.lgflags li,.ocmine,.flag .todo,.upd .todo,.proto,.gapnote,.rcard,.ocwhy li{border-radius:4px}
.tiles .tile{border-left:3px solid var(--line)}

/* home: the three steps are a real sequence, so big serif numerals, no tinted boxes */
.big{grid-template-columns:44px 1fr 22px;padding:16px 16px 16px 12px}
.big .num,.big.main .num,.big.red .num{width:auto;height:auto;background:none;font-family:var(--display);font-weight:900;font-size:44px;line-height:1;color:var(--brand)}
.big.main .num{color:var(--brand-ink)}
.big b{font-weight:800}
.callstrip{border-style:dashed;border-width:1.5px}
.callstrip .n{font-family:var(--body);font-weight:700;color:var(--stamp)}
.tile2 .ic{font-size:22px}
.more-sec h2{color:var(--ink)}

/* buttons, inputs, tags: squarer, no pills */
.btn{border-radius:6px;font-weight:600}
.btn:not(.ghost){box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.search,.rlwrap,.lgf input,.lgf select,.lgf textarea,.mdist{border-radius:4px;border-width:1px;background:var(--card)}
.regs button,.mseg button,.shr summary,.shr button,.seg button,.mzoom button,.mf .pills label{border-radius:4px;border-width:1px}
.acc,.chip{border-radius:3px}
.visitors{border-radius:4px}
.toast{border-radius:4px}

/* source badges read like ink stamps, not candy chips */
.badge{border-radius:3px;background:none;border:1.5px solid currentColor;font-weight:700;padding:1px 8px}
.b-official{color:var(--brand)} .b-news,.b-draft{color:var(--amber)}

/* bottom tabs */
.tabs{border-top:1px solid var(--line)}
.tabs a[aria-current="page"]{color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}

/* risk: one solid red block is enough */
.riskhero{border-radius:var(--r)}
.route li::before{border-radius:4px}
</style>

</head>

<script>(function(){var v=Math.floor(Date.now()/600000);document.write('<script src="data.js?t='+v+'"><\/script><script src="agencies.js?t='+v+'"><\/script>'+(document.documentElement.lang==='en'?'<script src="data-en.js?t='+v+'"><\/script>':''))})()</script>
<script>
(function(){
/* ---------- language: Bangla by default, English when chosen (EN button, or ?lang=en) ----------
   Interface text: T('বাংলা', 'English') right where it is used.
   Data text: data-en.js is a dictionary { "Bangla sentence from data.js": "English" }; any string missing
   from it stays in Bangla (run: node tools/check-en.js to list them). */
const EN = document.documentElement.lang === 'en';
const T = (bn, en) => EN ? en : bn;
const D_BN = window.APP_DATA;   // always Bangla: used for the complaint letter, which goes to BMET in Bangla
function enOverlay(src, dict){
  const miss = new Set();
  const tr = v => {
    if(typeof v !== 'string' || !/[\u0980-\u09FF]/.test(v)) return v;
    if(Object.prototype.hasOwnProperty.call(dict, v)) return dict[v];
    if(/^[০-৯\s.,:\-–/%]+$/.test(v)) return v.replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));
    miss.add(v); return v;
  };
  const walk = v => Array.isArray(v) ? v.map(walk) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, walk(x)])) : tr(v);
  const out = walk(src);
  // share links and #u-… addresses are built from the Bangla title, so they match in both languages
  ['UPDATES', 'NEWS'].forEach(k => (out[k]||[]).forEach((x, i) => x._bt = src[k][i].title));
  if(miss.size) console.info('English missing for', miss.size, 'text(s) in data.js:', [...miss]);
  return out;
}
const D = EN && window.APP_DATA_EN ? enOverlay(window.APP_DATA, window.APP_DATA_EN) : window.APP_DATA;
const view = document.getElementById('view');
const backBtn = document.getElementById('back');

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bnDigits = s => EN ? String(s) : String(s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
/* Built by hand, not Intl: many phone browsers (in-app/WebView, older Safari) lack Bangla locale data and fall back to 0-9. */
const bnNum = n => {
  n = +n; if(!isFinite(n)) return '';
  const neg = n < 0, [i, f] = String(+Math.abs(n).toFixed(3)).split('.');
  const g = i.length > 3 ? i.slice(0, -3).replace(/\B(?=(\d{2})+$)/g, ',') + ',' + i.slice(-3) : i;
  return (neg ? '-' : '') + bnDigits(g + (f ? '.' + f : ''));
};
const taka = n => '৳' + bnNum(n);
const lakh = n => n >= 100000 ? bnNum(+(n/100000).toFixed(2)) + T(' লাখ', ' lakh') : bnNum(n);
const src = id => D.SOURCES[id];
const srcLine = id => { const s = src(id); if(!s) return ''; return `<div class="src">${T('তথ্য নেওয়া হয়েছে', 'Source')}: <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>${s.date ? ' · ' + esc(bnDigits(s.date)) : ''}</div>`; };
const BADGE = {
  official: ['b-official',T('সরকারি প্রজ্ঞাপন থেকে','From the government notice')],
  news:     ['b-news',T('সংবাদে প্রকাশিত · সরকারি কাগজ যাচাই বাকি','Reported in the news · official document not yet checked')],
  draft:    ['b-draft',T('খসড়া · যাচাই চলছে','Draft · being checked')]
};
const badge = st => { const b = BADGE[st] || BADGE.draft; return `<span class="badge ${b[0]}">${b[1]}</span>`; };
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2200); }
const chev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const down = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const proto = `<div class="proto"><span>⚠</span><span>${T('পরীক্ষামূলক সংস্করণ। কিছু তথ্য এখনো যাচাই করা হচ্ছে, প্রতিটি সংখ্যার পাশে কোথা থেকে নেওয়া, তার লিংক দেওয়া আছে। এটি সরকারি অ্যাপ নয়।','Test version. Some information is still being checked; every number links to where it came from. This is not a government app.')}</span></div>`;

/* ---------- views ---------- */
/* Bangladesh time (UTC+6, no daylight saving) — the site's "today" and clock always follow Dhaka, wherever the visitor is */
const BD_MS = 6*3600e3;
const bdNow = () => new Date(Date.now() + BD_MS); // read with getUTC* methods
const bdToday = () => bdNow().toISOString().slice(0,10);
const bdClock = () => { const d = bdNow(), h = d.getUTCHours(), m = d.getUTCMinutes();
  if(EN) return (h % 12 || 12) + ':' + String(m).padStart(2,'0') + (h < 12 ? ' am' : ' pm');
  const part = h < 4 ? 'রাত' : h < 6 ? 'ভোর' : h < 12 ? 'সকাল' : h < 15 ? 'দুপুর' : h < 18 ? 'বিকাল' : h < 20 ? 'সন্ধ্যা' : 'রাত';
  return part + ' ' + bnNum(h % 12 || 12) + ':' + bnDigits(String(m).padStart(2,'0')); };
/* ---------- live pace strip: yearly total ÷ seconds in a year (average, not a live count) ---------- */
let paceTimer = null;
const paceInfo = () => { const p = D.STATS && D.STATS.pace; if(!p || !p.n) return null; return { p, every: 365*86400 / p.n }; };
const bdSecs = () => ((Date.now() + BD_MS)/1000) % 86400; // seconds since midnight, Bangladesh time
const paceToday = every => Math.floor(bdSecs() / every);
function paceStrip(){
  const x = paceInfo(); if(!x) return '';
  const sec = Math.round(x.every);
  return `<section class="pace" aria-label="${T('প্রতিদিন কতজন কাজে বিদেশ যান','How many people leave for work abroad each day')}">
    <p class="top"><span class="live"><i aria-hidden="true"></i>${T('আজ এ পর্যন্ত','So far today')}</span><span>${T('আনুমানিক','about')}</span><b class="cnt d" id="paceN">${bnNum(paceToday(x.every))}</b><span>${T('জন কাজে বিদেশ গেছেন','people have left for work abroad')}</span></p>
    <p class="clock">${T('বাংলাদেশ সময়','Bangladesh time')} <b class="d" id="paceClock">${bdClock()}</b>, ${bnDate(bdToday())}</p>
    <div class="lane" aria-hidden="true"><span class="end a">${T('বাংলাদেশ','Bangladesh')}</span><span class="flight">
      <span class="plane" id="pacePlane"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 12c0-.8-.7-1.5-1.5-1.5h-5.2L10 3H8l2.4 7.5H5.6L4 8.5H2.5l1 3.5-1 3.5H4l1.6-2h4.8L8 21h2l4.8-7.5H20c.8 0 1.5-.7 1.5-1.5z"/></svg></span></span><span class="end b">${T('বিদেশ','Abroad')}</span></div>
    <p class="sub">${T(`গড়ে প্রায় প্রতি ${bnNum(sec)} সেকেন্ডে একজন। ${esc(x.p.year)} সালে মোট ${bnNum(x.p.n)} জন গেছেন, সেই হিসাবে গড় করা, সরাসরি গণনা নয়।`, `On average, about one person every ${bnNum(sec)} seconds. Worked out from the ${bnNum(x.p.n)} people who left in ${esc(bnDigits(x.p.year))}; an average, not a live count.`)} <a href="#stats">${T('বিস্তারিত ›','Details ›')}</a></p>
  </section>`;
}
function startPace(){
  clearInterval(paceTimer); paceTimer = null;
  const el = document.getElementById('paceN'), pl = document.getElementById('pacePlane'), x = paceInfo();
  if(!el || !x) return;
  if(pl){ pl.style.animationDuration = x.every + 's'; pl.style.animationDelay = -(bdSecs() % x.every) + 's'; }
  let last = paceToday(x.every);
  paceTimer = setInterval(() => {
    if(!document.getElementById('paceN')){ clearInterval(paceTimer); paceTimer = null; return; }
    const n = paceToday(x.every), ck = document.getElementById('paceClock');
    if(ck){ const t = bdClock(); if(ck.textContent !== t) ck.textContent = t; }
    if(n !== last){ last = n; el.textContent = bnNum(n); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  }, 1000);
}
function home(){
  return `<div class="split"><div class="col-main">
  <section class="hero">
    <h1>${T('বিদেশে কাজে যাচ্ছেন? টাকা দেওয়ার আগে এই ৩টি জিনিস যাচাই করুন।','Going abroad for work? Check these 3 things before you pay anyone.')}</h1>
    <p>${T('ধার করে লাখ লাখ টাকা দেওয়ার আগে ৫ মিনিট সময় নিন।','Before you borrow lakhs of taka and hand it over, take 5 minutes.')}</p>
  </section>
  ${paceStrip()}
  <div class="steps3">
    <a class="big main" href="#check"><span class="num">${bnNum(1)}</span><span><b>${T('দালাল নাকি? লক্ষণগুলো মিলিয়ে নিন','Is it a broker scam? Check the signs')}</b><span>${T('দালাল চেনার ৬টি লক্ষণ এক পাতায়। যেটি মেলে, টিক দিন।','6 warning signs on one page. Tick the ones that match your offer.')}</span></span><span class="arr">${chev}</span></a>
    <a class="big" href="#agency"><span class="num">${bnNum(2)}</span><span><b>${T('এজেন্সির লাইসেন্স যাচাই','Check the agency licence')}</b><span>${T('লাইসেন্স আছে, নাকি বাতিল?','Is it licensed, or cancelled?')}</span></span><span class="arr">${chev}</span></a>
    <a class="big" href="#countries"><span class="num">${bnNum(3)}</span><span><b>${T('সরকারি খরচ ও নিয়ম','Official costs and rules')}</b><span>${T('কোন দেশে যেতে সরকার কত টাকা ঠিক করেছে','The maximum the government has set for each country')}</span></span><span class="arr">${chev}</span></a>
  </div>
  <div class="callstrip">
    <span class="n">${bnDigits('16768')}</span>
    <p>${T('ভিসা আসল কিনা যাচাই করুন: আমি প্রবাসী হেল্পলাইন (সৌদি আরব, কাতার, ওমান)','Check whether a visa is real: Ami Probashi helpline (Saudi Arabia, Qatar, Oman)')}</p>
  </div>
  <a class="mapcta" href="#map"><span class="ic" aria-hidden="true">🗺️</span><span><b>${T('কোথা থেকে, কোথায়?','From where, to where?')}</b><span>${T('কোন জেলা থেকে মানুষ কোন দেশে যাচ্ছেন, দালাল কত টাকা চাইছে: মানচিত্রে দেখুন, আপনার কথাও জানান।','Which districts people leave from, where they go, and what brokers ask for: see it on the map and add your own answer.')}<span id="mapctaN"></span></span></span><span class="arr">${chev}</span></a>
  <section class="more-sec" aria-label="${T('আরও যা আছে','More on this site')}">
    <h2>${T('আরও যা আছে','More on this site')}</h2>
    <div class="tiles">
      <a class="tile2" href="#ledger"><span class="ic" aria-hidden="true">📒</span><b>${T('টাকার হিসাব ও অভিযোগপত্র', "Payment record and complaint letter")}</b></a>
      <a class="tile2" href="#flags"><span class="ic" aria-hidden="true">⚠️</span><b>${T('দালালের কথা চিনুন', "Know the broker's lines")}</b></a>
      <a class="tile2 red" href="#risk"><span class="ic" aria-hidden="true">🚤</span><b>${T('লিবিয়া হয়ে নৌকায় ইতালি?', "By boat to Italy via Libya?")}</b></a>
      <a class="tile2" href="#myths"><span class="ic" aria-hidden="true">💡</span><b>${T('ভুল ধারণা ও সত্য', "Myths and facts")}</b></a>
      <a class="tile2" href="#help"><span class="ic" aria-hidden="true">📞</span><b>${T('সাহায্য ও অভিযোগ', "Help and complaints")}</b></a>
      <a class="tile2" href="#stats"><span class="ic" aria-hidden="true">📊</span><b>${T('প্রবাসে বাংলাদেশি: সংখ্যায়', "Bangladeshis abroad: the numbers")}</b></a>
    </div>
  </section>
  ${proto}
  </div>
  <aside class="col-news" aria-label="${T('সর্বশেষ খবর ও আপডেট','Latest news and updates')}">${updStrip()}${newsBlock()}</aside></div>`;
}

const updKey = u => 'u-' + u.date + '-' + hashStr(u._bt || u.title);

function shareItem(kind, key){

function doShare(how, it){

    window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank', 'noopener'); return;
  }

function wrapLines(ctx, text, maxW, maxLines){
  const words = String(text).split(/\s+/).filter(Boolean), lines = [];
  let line = '';
  for(let i = 0; i < words.length; i++){
    const t = line ? line + ' ' + words[i] : words[i];
    if(ctx.measureText(t).width <= maxW || !line){ line = t; continue; }
    lines.push(line); line = words[i];
    if(lines.length === maxLines){ line = null; break; }
  }
  if(line) lines.push(line);
  if(lines.length > maxLines) lines.length = maxLines;
  const used = lines.join(' ').split(/\s+/).length;
  if(used < words.length){
    let last = lines[lines.length-1];
    while(last && ctx.measureText(last + '…').width > maxW) last = last.split(' ').slice(0,-1).join(' ');
    lines[lines.length-1] = (last || '') + '…';
  }
  return lines;
}
async function makeCard(it){

  const W = 1080, H = 1350, P = 72, cv = document.createElement('canvas'); cv.width = W; cv.height = H;

  const DISP = '"Noto Sans Bengali",sans-serif', BODY = '"Noto Sans Bengali",sans-serif';
  x.fillStyle = C.paper; x.fillRect(0,0,W,H);

  // card
  const cardY = 190; x.fillStyle = '#fff'; x.beginPath(); x.roundRect(P-24, cardY, W-2*(P-24), H-cardY-190, 28); x.fill();
  const lvColor = {urgent:C.red, change:C.amber, info:C.brand, news:C.brand}[it.level] || C.brand;
  x.fillStyle = lvColor; x.fillRect(P-24, cardY, 14, H-cardY-190);
  let y = cardY + 60;
  const chip = (EN ? {urgent:'Urgent update', change:'Rule change', info:'Good to know', news:'News'} : {urgent:'জরুরি আপডেট', change:'নিয়ম পরিবর্তন', info:'জেনে রাখুন', news:'খবর'})[it.level] || T('আপডেট','Update');
  x.font = `700 32px ${BODY}`; const cw = x.measureText(chip).width + 44;
  x.fillStyle = lvColor; x.beginPath(); x.roundRect(P+10, y-30, cw, 60, 30); x.fill();
  x.fillStyle = '#fff'; x.fillText(chip, P+32, y+2);
  x.fillStyle = C.muted; x.font = `500 32px ${BODY}`; x.fillText(bnDigits(it.date), P+cw+34, y+2);
  y += 70; x.textBaseline = 'top';
  const tw = W - 2*P - 30;
  x.fillStyle = C.ink; x.font = `800 60px ${DISP}`;
  for(const l of wrapLines(x, it.title, tw, 4)){ x.fillText(l, P+10, y); y += 76; }
  y += 26;
  if(it.body){
    x.fillStyle = C.ink; x.font = `500 34px ${BODY}`;
    const room = Math.max(2, Math.floor((H - 190 - 330 - y) / 50));
    for(const l of wrapLines(x, it.body, tw, Math.min(room, 9))){ x.fillText(l, P+10, y); y += 50; }

  }
  if(it.todo){
    x.font = `600 33px ${BODY}`;
    const tl = wrapLines(x, it.todo, tw - 50, 5), bh = 70 + tl.length*48;
    x.fillStyle = C.soft; x.beginPath(); x.roundRect(P+10, y, tw, bh, 20); x.fill();
    x.fillStyle = C.brand; x.font = `800 34px ${DISP}`; x.fillText(T('✅ আপনার করণীয়','✅ What to do'), P+34, y+20);
    x.fillStyle = C.ink; x.font = `600 33px ${BODY}`; let ty = y + 70;
    for(const l of tl){ x.fillText(l, P+34, ty); ty += 48; }
  }
  // source line inside card bottom
  if(it.outlet){ x.fillStyle = C.muted; x.font = `500 28px ${BODY}`; x.fillText(T('খবর: ','News: ') + it.outlet, P+10, H-190-60); }
  // footer
  x.fillStyle = C.brand; x.fillRect(0, H-150, W, 150);

  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));

          <div class="track"><div class="fill cap" style="width:${pc(c.cap.amount)}%"></div></div></div>
        <div class="row"><div class="t"><span>${T('মানুষ আসলে দিচ্ছেন','What people actually pay')}</span><b>${lakh(c.reported.min)}–${lakh(c.reported.max)} ${T('টাকা','taka')}</b></div>
          <div class="track"><div class="fill rep" style="left:${pc(c.reported.min)}%;width:${pc(max)-pc(c.reported.min)}%"></div></div></div>
      </div>
      <div class="gapnote">${T(`সরকারি খরচের চেয়ে <b>${bnNum(Math.round(c.reported.min / c.cap.amount * 10)/10)} থেকে ${bnNum(Math.round(c.reported.max / c.cap.amount * 10)/10)} গুণ</b> বেশি টাকা দিচ্ছেন অনেকে। এর বেশিরভাগই নিয়মবিরুদ্ধ।`, `Many people pay <b>${bnNum(Math.round(c.reported.min / c.cap.amount * 10)/10)} to ${bnNum(Math.round(c.reported.max / c.cap.amount * 10)/10)} times</b> the official cost. Most of that extra is against the rules.`)}</div>
      <div class="src">${esc(c.reported.note || '')}</div>

    h += `<div class="note">${T('এর বেশি টাকা চাইলে লিখিত রসিদ চান এবং <a href="#flags">কোথায় অভিযোগ করবেন</a> দেখুন।','If anyone asks for more, ask for a written receipt and see <a href="#flags">where to complain</a>.')}</div>`;

  } else {
    h += `<div class="label">${T('এই দেশের জন্য সরকার নির্ধারিত খরচের তথ্য সংগ্রহ চলছে।',"We're still collecting the official cost for this country.")}</div>`;
  }

  // detailed breakdown + recommended routes
  h += `<section class="sec"><h2>${T('খরচের বিস্তারিত ও যাওয়ার সরকারি পথ','Cost details and official ways to go')}</h2>`;

    if(d.covered) h += `<h3 style="font-size:17px;margin-top:10px">${T('সরকার নির্ধারিত খরচে যা ধরা আছে','What the official cost covers')}</h3>${ul(d.covered)}<div class="src">${esc(d.coveredNote||'')}</div>`;
    if(d.employer) h += `<h3 style="font-size:17px;margin-top:10px">${T('নিয়োগকর্তার দেওয়ার কথা','The employer should pay')}</h3>${ul(d.employer)}<div class="src">${esc(d.employerNote||'')}</div>`;
    else if(d.employerNote) h += `<div class="src">${esc(d.employerNote)}</div>`;
    if(d.routes) h += `<h3 style="font-size:17px;margin-top:10px">${T('যাওয়ার সরকার অনুমোদিত পথ','Government-approved ways to go')}</h3>${ul(d.routes)}`;
    h += `${badge(d.status)}${srcLine(d.source)}<div class="note">${T('কোন খরচে কত টাকা, সরকার এখনো আলাদা করে প্রকাশ করেনি বা আমরা পাইনি। মোট সংখ্যার বেশি চাইলে রসিদ চান।',"The government hasn't published (or we haven't found) how much each item costs. If anyone asks for more than the total, ask for a receipt.")}</div>`;
  } else {
    h += `<div class="label">${T('এই দেশের খরচের বিস্তারিত তথ্য সংগ্রহ চলছে।',"We're still collecting cost details for this country.")}</div>
      <ul class="ol" style="margin:8px 0"><li>${T('শুধু BMET-এর লাইসেন্সপ্রাপ্ত রিক্রুটিং এজেন্সির মাধ্যমে যান।','Go only through a recruiting agency licensed by BMET.')} <a href="#agency">${T('এজেন্সি যাচাই করুন','Check the agency')}</a></li><li>${T('সরকারি প্রতিষ্ঠান BOESL-এর মাধ্যমেও যাওয়া যায়।','You can also go through BOESL, the government agency.')}</li></ul>
      <div class="src">${T('খসড়া তথ্য, যাচাই চলছে।','Draft information, being checked.')}</div>`;
  }
  h += `</section>`;

  // visa check
  if(c.visaCheck){
    h += `<div class="callstrip"><span class="n">${bnDigits('16768')}</span><p>${T('এই দেশের ভিসা আসল কিনা ফোন করে যাচাই করুন (আমি প্রবাসী, সামান্য ফি)।','Call to check whether a visa for this country is real (Ami Probashi, small fee).')}</p></div>`;
  }

  // fees
  if(D.FEES.length){
    h += `<section class="sec"><h2>${T('সবাইকে যে সরকারি ফি দিতে হয়','Government fees everyone pays')}</h2><div class="fees">` +
      D.FEES.map(f => `<div class="fee"><span>${esc(f.name)}<br><span class="src">${esc(f.from||'')}</span></span><b>${taka(f.amount)}</b></div>`).join('') +
      `</div>${D.FEES.map(f=>srcLine(f.source)).join('')}</section>`;
  }

  // steps
  h += `<section class="sec"><h2>${T('বৈধভাবে যাওয়ার ধাপ','Steps to go legally')}</h2>
    <div class="progress" id="prog"></div>
    <ul class="check">` +
    D.STEPS.map((s,i) => `<li class="${done.includes(i)?'done':''}"><input type="checkbox" id="st-${c.id}-${i}" data-i="${i}" ${done.includes(i)?'checked':''}><label for="st-${c.id}-${i}"><b>${esc(s.title)}</b><span>${esc(s.detail)}</span></label></li>`).join('') +
    `</ul>${D.STEPS.some(s=>s.status!=='official') ? `<div class="src">${T('কিছু ধাপ এখনো খসড়া, যাচাই চলছে।','Some steps are still drafts, being checked.')}</div>` : ''}</section>`;

  h += shareBlock(T(`${c.name}-এ যেতে সরকার নির্ধারিত খরচ ও নিয়ম দেখুন`, `See the official cost and rules for going to ${c.name}`));
  return h;
}

/* ---------- numbers: tiles + bar charts ---------- */
const srcShort = id => { const s = src(id); if(!s) return ''; return `<div class="src">${T('তথ্য নেওয়া হয়েছে','Source')}: <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title.split(' — ').pop())}</a>${s.date ? ' · ' + esc(bnDigits(s.date)) : ''}</div>`; };
const statVal = x => x.text ? esc(x.text) : bnNum(x.n) + (x.unit ? ' ' + esc(x.unit) : T(' জন', ' people'));
function statTiles(list, danger){
  return `<div class="tiles">${list.map(x => `<div class="tile${danger ? ' danger' : ''}"><span class="v">${statVal(x)}</span><span class="l">${esc(x.label)}</span>${x.note ? `<span class="nt">${esc(x.note)}</span>` : ''}${x.status === 'draft' ? `<span class="nt">${T('আনুমানিক · যাচাই চলছে','Estimate · being checked')}</span>` : ''}${srcShort(x.source)}</div>`).join('')}</div>`;
}
/* rows: [{label | country id, n, kind}] — one series, bars scaled to the largest value */
function barList(rows){
  const max = Math.max(...rows.map(r => r.n));
  return `<ul class="bars">${rows.map(r => {
    const c = r.id && D.COUNTRIES.find(x => x.id === r.id);
    const name = c ? `<a href="#c-${esc(c.id)}">${flagImg(c)} ${esc(c.name)}</a>` : `<span>${esc(r.label)}</span>`;
    return `<li title="${esc(c ? c.name : r.label)}: ${bnNum(r.n)}${T(' জন', ' people')}"><div class="t">${name}<b>${bnNum(r.n)}</b></div><div class="tr"><div class="fl${r.kind === 'irregular' ? ' irr' : ''}" style="width:${(r.n / max * 100).toFixed(1)}%"></div></div></li>`;
  }).join('')}</ul>`;
}

function checkRL(raw){
  const box = document.getElementById('rlresult');
  const digits = String(raw).replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/\D/g,'').replace(/^0+/,'');
  if(!digits){ box.innerHTML = `<div class="result"><b>${T('শুধু সংখ্যাটি লিখুন','Enter just the number')}</b><div class="src">${T('যেমন: RL-1428 হলে লিখুন 1428','For example, for RL-1428 enter 1428')}</div></div>`; return; }
  const L = window.AGENCY_LIST;
  const off = L && L.rows.find(r => r[0] === digits);
  if(off){
    const [rl, name, st, exp] = off;
    const lapsed = st === 'active' && exp && exp < bdToday();
    const info = (EN ? {
      active:    ['good','green','Active',"The licence is valid until it expires. Still, don't pay without a written contract and receipt."],
      expired:   ['bad','red','Expired',"The licence has expired. Don't pay."],
      cancelled: ['bad','red','Cancelled',"The licence is cancelled. Don't pay."],
      suspended: ['bad','red','Suspended',"The licence is suspended. Don't pay."]
    } : {
      active:    ['good','green','সক্রিয়','মেয়াদ শেষ না হওয়া পর্যন্ত লাইসেন্স বৈধ। তবে লিখিত চুক্তি ও রসিদ ছাড়া টাকা দেবেন না।'],
      expired:   ['bad','red','মেয়াদ শেষ','লাইসেন্সের মেয়াদ শেষ। টাকা দেবেন না।'],
      cancelled: ['bad','red','বাতিল','লাইসেন্স বাতিল। টাকা দেবেন না।'],
      suspended: ['bad','red','স্থগিত','লাইসেন্স স্থগিত। টাকা দেবেন না।']
    })[lapsed ? 'expired' : st] || ['warn2','amber',st,T('অবস্থা নিশ্চিত নয়, সরকারি তালিকায় দেখুন।','Status unclear; check the official list.')];
    const flagged = D.AGENCIES_FLAGGED.find(a => a.rl === digits);
    box.innerHTML = `<div class="result ${info[0]}">
      <span class="stamp ${info[1]}">${info[2]}</span>
      <div><b>RL-${esc(bnDigits(rl))} · ${esc(name)}</b></div>
      <div>${info[3]}</div>
      ${exp ? `<div>${T('মেয়াদ','Valid until')}: ${esc(bnDigits(exp))}</div>` : ''}
      ${flagged ? `<div>${esc(bnDigits(flagged.date))}: ${esc(flagged.reason)}।</div>${srcLine(flagged.source)}` : ''}
      <div class="src">${T(`সরকারি (BMET) তালিকার কপি, ${esc(bnDigits(L.date))} তারিখে নেওয়া। সর্বশেষ অবস্থা <a href="https://oep.gov.bd/agencies" target="_blank" rel="noopener">সরকারি সাইটে</a> মিলিয়ে নিন।`, `Copy of the official (BMET) list, taken ${esc(bnDigits(L.date))}. Confirm the latest status on the <a href="https://oep.gov.bd/agencies" target="_blank" rel="noopener">government site</a>.`)}</div>
    </div>`;
    box.scrollIntoView({behavior:'smooth',block:'nearest'});
    return;
  }
  const hit = D.AGENCIES_FLAGGED.find(a => a.rl === digits);
  if(hit){
    const word = hit.status === 'suspended' ? T('স্থগিত','suspended') : T('বাতিল','cancelled');
    box.innerHTML = `<div class="result bad">
      <span class="stamp red">${T('লাইসেন্স ' + word, 'Licence ' + word)}</span>
      <div><b>RL-${esc(bnDigits(hit.rl))} · ${esc(hit.name)}</b></div>
      <div>${T(`${esc(bnDigits(hit.date))} লাইসেন্স ${word} করা হয়েছে। কারণ: ${esc(hit.reason)}।`, `Licence ${word} on ${esc(bnDigits(hit.date))}. Reason: ${esc(hit.reason)}.`)}</div>
      <div style="font-weight:700;color:var(--stamp)">${T('এই এজেন্সিকে টাকা দেবেন না। আগে দিয়ে থাকলে রসিদ ও কাগজ রেখে অভিযোগ করুন।',"Don't pay this agency. If you already paid, keep the receipts and papers and file a complaint.")}</div>
      ${srcLine(hit.source)}
      <a class="btn" href="#ledger">${T('টাকার হিসাব ও অভিযোগপত্র','Payment record and complaint letter')}</a>
    </div>`;
  } else {
    box.innerHTML = `<div class="result">
      <span class="stamp amber">${T('নিজে যাচাই করুন','Check it yourself')}</span>
      <div><b>RL-${esc(bnDigits(digits))}</b> ${T('সরকারি তালিকার আমাদের কপিতে পাওয়া যায়নি।','was not found in our copy of the official list.')}</div>
      <div>${T('নম্বরটি ঠিক আছে কিনা দেখুন। তালিকায় না থাকলে ওই এজেন্সির সঙ্গে লেনদেন করবেন না। নিচের সরকারি তালিকায় অবশ্যই দেখে নিন।',"Check the number is right. If it isn't on the list, don't deal with that agency. Be sure to check the official list below.")}</div>
    </div>`;
  }
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

const LG_TO_BN = {agency:'এজেন্সি', dalal:'দালাল / মধ্যস্থতাকারী', other:'অন্য কেউ'};
const LG_HOW_BN = {cash:'নগদ', bkash:'বিকাশ / নগদ / রকেট', bank:'ব্যাংক'};
const LG_TO = EN ? {agency:'Agency', dalal:'Broker / middleman', other:'Someone else'} : LG_TO_BN;
const LG_HOW = EN ? {cash:'Cash', bkash:'bKash / Nagad / Rocket', bank:'Bank'} : LG_HOW_BN;
const enDigits = s => String(s ?? '').replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));
const bnDate = iso => iso ? bnDigits(iso.split('-').reverse().join('-')) : '';
function lgLoad(){ const L = store.get('ledger') || {}; L.payments = L.payments || []; return L; }
function lgAgency(rl){
  const d = enDigits(rl).replace(/\D/g,'').replace(/^0+/,'');
  if(!d) return null;
  const row = window.AGENCY_LIST && window.AGENCY_LIST.rows.find(r => r[0].replace(/^0+/,'') === d);
  const flagged = (D.AGENCIES_FLAGGED||[]).find(a => a.rl.replace(/^0+/,'') === d);
  if(row){
    const lapsed = row[2] === 'active' && row[3] && row[3] < bdToday();
    return { rl: row[0], name: row[1], st: lapsed ? 'expired' : row[2], exp: row[3], flagged };
  }
  if(flagged) return { rl: flagged.rl, name: flagged.name, st: flagged.status || 'cancelled', flagged };
  return { rl: d, name: '', st: 'missing' };
}
const LG_ST = EN ? {active:'active', expired:'expired', cancelled:'cancelled', suspended:'suspended', missing:'not in the official list'} : {active:'সক্রিয়', expired:'মেয়াদ শেষ', cancelled:'বাতিল', suspended:'স্থগিত', missing:'সরকারি তালিকায় নেই'};

function lgCalc(L){
  const c = D.COUNTRIES.find(x => x.id === L.country);
  const cap = c && c.cap && c.cap.amount || null;
  const P = L.payments;
  const sum = f => P.filter(f).reduce((s,p) => s + p.amt, 0);
  const total = sum(() => true);
  return { c, cap, total, over: cap ? total - cap : null,
    noRcpt: sum(p => !p.rcpt), toDalal: sum(p => p.to === 'dalal'), cash: sum(p => p.how === 'cash'),
    ag: lgAgency(L.rl) };
}

function lgLetterHtml(L, k){
  const BN = v => String(v ?? '').replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
  const tk = n => BN(taka(n)), LG_TO = LG_TO_BN, LG_HOW = LG_HOW_BN, bnDigits = BN, bnNum = n => BN(String(n));
  const bnDate = iso => iso ? BN(iso.split('-').reverse().join('-')) : '';
  const cBn = k.c && D_BN.COUNTRIES.find(x => x.id === k.c.id);
  const blank = '..................';
  const ag = k.ag;
  const agTxt = ag ? `${ag.name ? esc(ag.name) + ' ' : ''}(RL-${esc(bnDigits(ag.rl))})` : 'রিক্রুটিং এজেন্সি ' + blank;
  const who = L.broker ? `দালাল ${esc(L.broker)}${L.brokerPhone ? ' (মোবাইল: ' + esc(bnDigits(L.brokerPhone)) + ')' : ''}` : '';
  const against = [ag ? agTxt : '', who].filter(Boolean).join(' এবং ') || blank;
  const cname = cBn ? esc(cBn.name) : blank;
  const subj = k.over > 0 ? 'সরকার নির্ধারিত অভিবাসন ব্যয়ের অতিরিক্ত অর্থ আদায়ের' : 'বিদেশে চাকরির কথা বলে অর্থ গ্রহণ ও প্রতারণার';
  const rows = L.payments.slice().sort((a,b) => (a.d||'').localeCompare(b.d||'')).map((p,i) =>
    `<tr><td>${bnNum(i+1)}</td><td>${esc(bnDate(p.d))}</td><td>${esc(LG_TO[p.to])}</td><td>${esc(LG_HOW[p.how])}</td><td>${esc(p.for||'')}</td><td>${tk(p.amt)}</td><td>${p.rcpt?'আছে':'নেই'}</td></tr>`).join('');

  return `<p>তারিখ: ${today}</p>
  <p>বরাবর,<br>মহাপরিচালক<br>জনশক্তি কর্মসংস্থান ও প্রশিক্ষণ ব্যুরো (বিএমইটি)<br>কাকরাইল, ঢাকা।</p>

function lgRender(){
  const L = lgLoad(), k = lgCalc(L);
  const ag = k.ag, agBox = document.getElementById('lgAg');
  if(agBox){
    agBox.className = 'lghint ' + (!ag ? '' : ag.st === 'active' ? 'ok' : 'bad');
    agBox.textContent = !ag ? '' : `${ag.name || 'RL-' + bnDigits(ag.rl)}: ${T('', 'licence ')}${LG_ST[ag.st] || ag.st}`;
  }
  document.getElementById('lgList').innerHTML = L.payments.map((p,i) => `<li>
    <span class="a">${taka(p.amt)}</span>
    <span class="m">${esc(bnDate(p.d))} · ${esc(LG_TO[p.to])} · ${esc(LG_HOW[p.how])}${p.for ? ' · ' + esc(p.for) : ''} · ${p.rcpt ? T('রসিদ আছে','receipt') : `<span class="nr">${T('রসিদ নেই','no receipt')}</span>`}</span>
    <button class="x" type="button" data-del="${i}" aria-label="${T('মুছুন','Delete')}">×</button></li>`).join('');

  const F = [];
  if(k.c && k.c.access && k.c.access.state === 'closed') F.push(['r', T(`${k.c.name}-এ কর্মী যাওয়া বন্ধ বা স্থগিত থাকার খবর আছে।`, `Reports say hiring of workers for ${k.c.name} is stopped or suspended.`), T('এখন টাকা দিলে বড় ঝুঁকি। আগে BMET-এ নিশ্চিত হোন।','Paying now is a big risk. Confirm with BMET first.')]);
  if(ag && ag.st !== 'active') F.push(['r', T(`এজেন্সির লাইসেন্স: ${LG_ST[ag.st] || ag.st}।`, `Agency licence: ${LG_ST[ag.st] || ag.st}.`), T('এই এজেন্সিকে আর টাকা দেবেন না। আগের টাকার প্রমাণ রেখে অভিযোগ করুন।',"Don't pay this agency any more. Keep proof of what you paid and file a complaint.")]);
  if(k.over > 0) F.push(['r', T(`সরকারি সীমার চেয়ে ${taka(k.over)} বেশি দিয়েছেন।`, `You have paid ${taka(k.over)} more than the official limit.`), T('এর বেশি আর দেবেন না। এই অতিরিক্ত টাকা ফেরত চেয়ে অভিযোগ করতে পারেন।',"Don't pay any more. You can file a complaint to get the extra back.")]);
  if(k.noRcpt) F.push(['a', T(`${taka(k.noRcpt)}-এর কোনো লিখিত রসিদ নেই।`, `${taka(k.noRcpt)} has no written receipt.`), T('এখনই সই ও তারিখসহ রসিদ চান। রসিদ না দিলে সেটাই সতর্ক সংকেত।',"Ask for a signed, dated receipt now. Refusing to give one is itself a warning sign.")]);
  if(k.toDalal) F.push(['a', T(`দালালকে দিয়েছেন ${taka(k.toDalal)}।`, `You paid a broker ${taka(k.toDalal)}.`), T('লাইসেন্স ছাড়া কেউ কর্মী পাঠাতে পারে না। দালালের নাম, ফোন নম্বর ও সাক্ষীর নাম লিখে রাখুন।',"Nobody may send workers abroad without a licence. Write down the broker's name, phone number and the names of witnesses.")]);
  if(k.cash && k.cash === k.total && k.total) F.push(['a', T('সব টাকা নগদে দিয়েছেন।','You paid everything in cash.'), T('নগদ টাকার প্রমাণ থাকে না। এরপর ব্যাংক বা বিকাশে দিন, যাতে লেনদেনের রেকর্ড থাকে।','Cash leaves no proof. From now on pay by bank or bKash, so there is a record.')]);
  if(!F.length && k.total) F.push(['g', T('এখন পর্যন্ত বড় কোনো সমস্যা দেখা যাচ্ছে না।','No big problems so far.'), T('প্রতিটি টাকার রসিদ রাখুন এবং সরকারি সীমা পার হওয়ার আগে থামুন।','Keep a receipt for every payment, and stop before you go over the official limit.')]);

  const pct = k.cap ? Math.min(100, k.total / Math.max(k.total, k.cap) * 100) : 0;
  const capAt = k.cap ? k.cap / Math.max(k.total, k.cap) * 100 : 0;
  document.getElementById('lgSum').innerHTML = `<h2>${T('মোট হিসাব','Total')}</h2>
    <div class="label">${T('এ পর্যন্ত দিয়েছেন','Paid so far')}</div>
    <div class="money">${taka(k.total)}</div>
    ${k.cap ? `<div class="meter">
        <div class="track"><div class="fill ${k.over > 0 ? 'rep' : 'cap'}" style="left:0;width:${pct}%"></div><div class="capmark" style="left:calc(${capAt}% - 2px)"></div></div>
        <div class="row"><div class="t"><span>${T('সরকারি সর্বোচ্চ খরচ','Official maximum cost')} (${esc(k.c.name)})</span><b>${taka(k.cap)}</b></div></div>
        ${k.over > 0 ? `<div class="gapnote">${T(`সীমার চেয়ে <b>${taka(k.over)}</b> বেশি`, `<b>${taka(k.over)}</b> over the limit`)}</div>` : `<div class="row"><div class="t"><span>${T('সীমা পর্যন্ত বাকি','Left before the limit')}</span><b>${taka(-k.over)}</b></div></div>`}
      </div>${k.c.cap.source ? srcLine(k.c.cap.source) : ''}`
      : `<div class="note">${k.c ? T(`${esc(k.c.name)}-এর সরকারি সর্বোচ্চ খরচের তথ্য আমাদের কাছে এখনো নেই। BMET বা জেলা জনশক্তি অফিসে জেনে নিন।`, `We don't have the official maximum cost for ${esc(k.c.name)} yet. Ask BMET or your district manpower office.`) : T('উপরে দেশ বাছলে সরকারি সীমার সঙ্গে তুলনা দেখাবে।','Choose a country above to compare with the official limit.')}</div>`}
    ${F.length ? `<ul class="lgflags">${F.map(f => `<li class="${f[0]}"><b>${f[1]}</b> ${f[2]}</li>`).join('')}</ul>` : ''}`;
  document.getElementById('lgLetter').innerHTML = lgLetterHtml(L, k);
}

function lgRun(){
  const save = L => { store.set('ledger', L); lgRender(); };
  view.querySelectorAll('[data-k]').forEach(el => el.addEventListener('input', () => { const L = lgLoad(); L[el.dataset.k] = el.value; save(L); }));
  view.querySelectorAll('.seg').forEach(g => g.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    g.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  }));
  const seg = n => view.querySelector(`[data-seg="${n}"] [aria-pressed="true"]`).dataset.v;
  document.getElementById('lgAddBtn').addEventListener('click', () => {
    const inp = document.getElementById('lgAmt');
    const amt = +enDigits(inp.value).replace(/[^\d]/g,'');
    if(!amt){ toast(T('টাকার পরিমাণ লিখুন','Enter the amount')); inp.focus(); return; }
    const L = lgLoad();
    L.payments.push({ amt, d: document.getElementById('lgDate').value, to: seg('to'), how: seg('how'), rcpt: seg('rcpt') === '1', for: document.getElementById('lgFor').value.trim() });
    save(L);
    inp.value = ''; document.getElementById('lgFor').value = '';
    toast(taka(amt) + T(' যোগ হয়েছে', ' added'));
    document.getElementById('lgSum').scrollIntoView({behavior:'smooth', block:'start'});
  });
  document.getElementById('lgList').addEventListener('click', e => {
    const b = e.target.closest('[data-del]'); if(!b) return;
    const L = lgLoad(); L.payments.splice(+b.dataset.del, 1); save(L);
  });
  document.getElementById('lgPrint').addEventListener('click', () => window.print());
  document.getElementById('lgCopy').addEventListener('click', async () => {
    const t = document.getElementById('lgLetter').innerText;
    try{ await navigator.clipboard.writeText(t); toast(T('চিঠি কপি হয়েছে','Letter copied')); }catch(e){ toast(T('কপি করা যায়নি',"Couldn't copy")); }
  });
  const w = document.getElementById('lgWipe'); let armed = false;
  w.addEventListener('click', () => {
    if(!armed){ armed = true; w.textContent = T('⚠️ নিশ্চিত? আবার চাপলে সব মুছে যাবে','⚠️ Sure? Tap again to delete everything'); setTimeout(() => { armed = false; w.textContent = T('🗑️ এই ফোন থেকে সব হিসাব মুছে ফেলুন','🗑️ Delete all records from this phone'); }, 4000); return; }
    try{ localStorage.removeItem('ledger'); }catch(e){}
    toast(T('সব হিসাব মুছে ফেলা হয়েছে','All records deleted')); route();
  });
  lgRender();
}

function offerCheck(){
  const Q = D.OFFER_CHECK || [];
  return `<h1 style="font-size:28px">${T(`দালাল চেনার ${bnNum(Q.length)}টি লক্ষণ`, `${Q.length} signs of a broker scam`)}</h1>
  <p style="margin:0;color:var(--muted)">${T('বিদেশের চাকরির প্রস্তাবে এগুলোর কোনোটি থাকলে সাবধান। যেটি আপনার প্রস্তাবে আছে, তাতে টিক দিন — নিচে ফল দেখাবে।',"Be careful if a job offer abroad has any of these. Tick the ones in your offer and the result appears below.")}</p>
  ${bnVoice && !EN ? '<button class="btn ghost" type="button" id="ocsay">🔊 সবগুলো শুনুন</button>' : ''}
  <ul class="ocfacts">${Q.map((q,i) => `<li class="ocfact ${q.level === 'high' ? 'high' : ''}" id="ocf${i}">

      <label class="ocmine"><input type="checkbox" data-i="${i}"> ${T('আমার প্রস্তাবে এটা আছে','My offer has this')}</label></div>
  </li>`).join('')}</ul>
  <div id="ocres" aria-live="polite"></div>
  <section class="sec"><h2>${T('এখন কী করবেন','What to do now')}</h2>
    <div class="ocnext">
      <a class="btn wide" href="#agency">${T('এজেন্সির লাইসেন্স যাচাই করুন',"Check the agency's licence")}</a>
      <a class="btn ghost wide" href="#countries">${T('দেশের সরকারি খরচ দেখুন','See the official cost for your country')}</a>
      <a class="btn ghost wide" href="#ledger">${T('টাকার হিসাব খাতা খুলুন','Open the payment record')}</a>
      <a class="btn ghost wide" href="#help">${T('কোথায় সাহায্য ও অভিযোগ','Where to get help and complain')}</a>
    </div>
    <div class="note">${T('সৌদি আরব, কাতার বা ওমানের ভিসা আসল কিনা জানতে ১৬৭৬৮ নম্বরে কল করুন (আমি প্রবাসী হেল্পলাইন)।','To check whether a visa for Saudi Arabia, Qatar or Oman is real, call 16768 (Ami Probashi helpline).')}</div>
  </section>
  ${shareBlock(T('দালাল নাকি? বিদেশের চাকরির প্রস্তাবে দালাল চেনার লক্ষণগুলো দেখে নিন','Is it a broker scam? Check the warning signs in a job offer abroad'))}`;
